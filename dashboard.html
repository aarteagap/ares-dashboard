function refreshExecute(){
  const rows = EXECUTE_RAW || [];
  if (!document.getElementById('exec-kg')) return;
  const selSH = msdFilterValues('msd-exec-sh') || [];
  const selDT = msdFilterValues('msd-exec-dt') || [];
  let ft = rows;
  if (selSH.length) ft = ft.filter(r=>selSH.includes(r.shipper));
  if (selDT.length) ft = ft.filter(r=>selDT.includes(r.dispatch_date||''));
  document.getElementById('exec-stat').textContent = `${ft.length} de ${rows.length} registros`;

  const coldTreatments = ft.filter(r=>r.has_tr_time).length;
  const senasaCount = ft.filter(r=>r.senasa_att==='SENASA').length;
  const totalBooking = new Set(ft.filter(r=>r.booking).map(r=>r.booking)).size;
  const bookByMode = m => new Set(ft.filter(r=>r.mode===m && r.booking).map(r=>r.booking)).size;
  const bookAer = bookByMode('Aéreo'), bookMar = bookByMode('Marítimo'), bookTer = bookByMode('Terrestre');
  const senasaPct = totalBooking ? pct(senasaCount,totalBooking) : 0;

  document.getElementById('exec-kg').innerHTML = `<div class="kg">
    <div class="kc" style="--acc:var(--blue)"><div class="kl">Cold treatments</div><div class="kv">${coldTreatments}</div></div>
    <div class="kc" style="--acc:var(--amber)"><div class="kl">Senasa Attention</div><div class="kv" style="font-size:20px;">${senasaCount} / ${totalBooking}</div><div class="kf">${senasaPct}%</div></div>
    <div class="kc" style="--acc:var(--navy2)"><div class="kl">Booking confirmado</div><div class="kv">${totalBooking}</div></div>
    <div class="kc" style="--acc:var(--blue)"><div class="kl">Booking aéreo</div><div class="kv">${bookAer}</div><div class="kf">${totalBooking?pct(bookAer,totalBooking):0}%</div></div>
    <div class="kc" style="--acc:var(--navy2)"><div class="kl">Booking marítimo</div><div class="kv">${bookMar}</div><div class="kf">${totalBooking?pct(bookMar,totalBooking):0}%</div></div>
    <div class="kc" style="--acc:var(--purple)"><div class="kl">Booking terrestre</div><div class="kv">${bookTer}</div><div class="kf">${totalBooking?pct(bookTer,totalBooking):0}%</div></div>
  </div>`;

  const ex = EX || {dam_by_mode:[]};
  const mxM = Math.max(1, ...ex.dam_by_mode.map(m=>m.dam_with));
  document.getElementById('exec-dam').innerHTML = `
    <div class="card"><div class="ct">DAMs únicas por modo</div><div class="bars">${ex.dam_by_mode.length ? ex.dam_by_mode.map(m=>`<div class="br"><span class="bl">${m.mode}</span><div class="bt"><div class="bf" style="width:${calcPct(m.dam_with,mxM)}%"></div></div><span class="bv">${m.dam_with}</span></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>
    <div class="card"><div class="ct">Cobertura DAM</div><div class="tbl-wrap"><table class="std"><thead><tr><th>Modo</th><th style="text-align:right">DAMs</th><th style="text-align:right">Sin DAM</th><th style="text-align:right">% Cob.</th></tr></thead><tbody>${ex.dam_by_mode.map(m=>`<tr><td>${m.mode}</td><td class="mono" style="text-align:right">${m.dam_with}</td><td class="mono" style="text-align:right">${m.dam_without}</td><td><span class="pill ${badge(m.pct)}">${m.pct}%</span></td></tr>`).join('')}</tbody></table></div></div>`;

  const dest = DEST || [], lineas = LINEAS || [];
  const mxD = Math.max(1, ...dest.map(d=>d.fcl)), mxL = Math.max(1, ...lineas.map(l=>l.fcl));
  document.getElementById('exec-routes').innerHTML = `
    <div class="card"><div class="ct">Top destinos</div><div class="bars">${dest.length ? dest.map(d=>`<div class="br"><span class="bl">${d.port}</span><div class="bt"><div class="bf" style="width:${calcPct(d.fcl,mxD)}%;background:var(--amber);"></div></div><span class="bv">${fmt1(d.fcl)}</span></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>
    <div class="card"><div class="ct">FCL por línea naviera</div><div class="bars">${lineas.length ? lineas.map(l=>`<div class="br"><span class="bl">${l.line}</span><div class="bt"><div class="bf" style="width:${calcPct(l.fcl,mxL)}%"></div></div><span class="bv">${fmt1(l.fcl)}</span></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>`;

  // Curva: PO/booking distintos por Pack Plan, una línea por modo
  const weeks = [...new Set(ft.map(r=>r.pack_plan))].sort((a,b)=>a-b);
  document.getElementById('exec-line-stat').textContent = `${weeks.length} semana(s)`;
  const wrap = document.getElementById('exec-line-wrap');
  if (weeks.length < 2){
    wrap.innerHTML = '<div class="empty-state">Selecciona al menos 2 semanas para trazar la curva</div>';
    return;
  }
  const modeColors = {'Aéreo':'var(--blue)','Marítimo':'var(--navy2)','Terrestre':'var(--purple)'};
  const modeData = {};
  Object.keys(modeColors).forEach(m=>{ modeData[m] = weeks.map(wk=>new Set(ft.filter(r=>r.pack_plan===wk && r.mode===m && r.booking).map(r=>r.booking)).size); });

  const W=900, H=300, pL=34, pB=26, pT=12;
  const mxV = Math.max(...Object.values(modeData).flat(), 1);
  const xOf = i => pL + i*(W-pL-14)/(weeks.length-1);
  const yOf = v => H-pB-(v/mxV)*(H-pT-pB);
  const grid = [0,.25,.5,.75,1].map(f=>{ const y=pT+(1-f)*(H-pT-pB); return `<line x1="${pL}" y1="${y.toFixed(0)}" x2="${W-4}" y2="${y.toFixed(0)}" stroke="var(--line)" stroke-width="1"/><text x="${pL-6}" y="${(y+3).toFixed(0)}" text-anchor="end" font-size="9" fill="var(--ink-faint)" font-family="JetBrains Mono">${Math.round(mxV*f)}</text>`; }).join('');
  const xlbls = weeks.map((wk,i)=>`<text x="${xOf(i).toFixed(0)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-soft)" font-family="JetBrains Mono">S${wk}</text>`).join('');
  let svgLines = '';
  Object.keys(modeColors).forEach(m=>{
    const pts = weeks.map((wk,i)=>({x:xOf(i), y:yOf(modeData[m][i])}));
    const path = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
    svgLines += `<path d="${path}" fill="none" stroke="${modeColors[m]}" stroke-width="2.2"/>`;
    svgLines += pts.map((p,i)=>`<circle class="exec-dot" data-mode="${m}" data-i="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.6" fill="${modeColors[m]}" stroke="var(--surface)" stroke-width="1.3" style="cursor:pointer;"/>`).join('');
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:${H}px;display:block;margin:0 auto;" preserveAspectRatio="xMidYMid meet">${grid}${svgLines}${xlbls}</svg>`;
  wrap.querySelectorAll('circle.exec-dot').forEach(dot=>{
    dot.addEventListener('mouseenter', ()=>{
      const m = dot.dataset.mode, i = +dot.dataset.i, wk = weeks[i];
      const tip = document.getElementById('execTooltip');
      tip.innerHTML = `<b>S${wk} · ${m}</b><br>Booking diferenciados: <b class="mono">${modeData[m][i]}</b>`;
      tip.style.opacity = '1';
      const rect = wrap.getBoundingClientRect();
      const scaleX = rect.width/W, scaleY = rect.height/H;
      const cx = +dot.getAttribute('cx')*scaleX, cy = +dot.getAttribute('cy')*scaleY;
      tip.style.left = (rect.left+cx+12)+'px';
      tip.style.top = (rect.top+cy-10)+'px';
    });
    dot.addEventListener('mouseleave', ()=>{ document.getElementById('execTooltip').style.opacity='0'; });
  });
}

function renderIncidencias(){

// Aplica los filtros globales (Shipper / Mode / Pack Plan) sobre INCIDENCIAS.
// Nota: el universo/denominador de compliance (UNIVERSO_COMPLIANCE) NO se
// filtra por estos criterios — sigue representando todo Horizon, ya que el
// backend no calcula universos desglosados por shipper. Los filtros acotan
// qué incidencias se cuentan/muestran (numerador), no el total de embarques.
function incFilteredRows(){
  let rows = INCIDENCIAS || [];
  const selShipper = msdFilterValues('msd-inc-shipper');
  const selMode = msdFilterValues('msd-inc-mode');
  const selPPRaw = msdFilterValues('msd-inc-pp');
  if (selShipper && selShipper.length) rows = rows.filter(r=>selShipper.includes(r.shipper));
  if (selMode && selMode.length) rows = rows.filter(r=>selMode.includes(r.mode));
  if (selPPRaw && selPPRaw.length) { const selPP = selPPRaw.map(Number); rows = rows.filter(r=>selPP.includes(r.pack_plan)); }
  return rows;
}

function incSwitchTab(tab){
  incActiveTab = tab;
  document.querySelectorAll('.inc-subtab').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  refreshIncidencias();
}

function refreshIncidencias(){
  const el = document.getElementById('inc-content');
  if (!el) return;
  const filtered = incFilteredRows();
  const statEl = document.getElementById('inc-stat');
  if (statEl) statEl.textContent = `${filtered.length} de ${(INCIDENCIAS||[]).length} incidencias`;
  if (incActiveTab==='resumen') el.innerHTML = incRenderResumen(filtered);
  else if (incActiveTab==='general') { el.innerHTML = incRenderGeneral(); incWireGeneralEvents(); }
  else if (incActiveTab==='maritimo') { el.innerHTML = incRenderModo('Marítimo', 'instructions', 'marítimo'); incWireModoEvents(); }
  else if (incActiveTab==='aereo') { el.innerHTML = incRenderModo('Aéreo', 'pos', 'aéreo'); incWireModoEvents(); }
  else if (incActiveTab==='terrestre') { el.innerHTML = incRenderModo('Terrestre', 'instructions', 'terrestre'); incWireModoEvents(); }
}

/* ---------------- RESUMEN ---------------- */
function incRenderResumen(filteredRows){
  const rows = filteredRows || INCIDENCIAS || [];
  const total = rows.length;
  const critVals = rows.map(r=>r.criticidad).filter(c=>c!=null);
  const critAvg = critVals.length ? (sum(critVals)/critVals.length).toFixed(1) : '—';

  // Scorecards por modo (a la izquierda de Criticidad promedio)
  const modeOrder = ['Marítimo','Aéreo','Terrestre'];
  const byModeCount = {};
  rows.forEach(r=>{ const k=r.mode||'(sin modo)'; byModeCount[k]=(byModeCount[k]||0)+1; });
  const modeCards = [...new Set(rows.map(r=>r.mode).filter(Boolean))].sort((a,b)=>modeOrder.indexOf(a)-modeOrder.indexOf(b))
    .map(m=>`<div class="kc" style="--acc:${m==='Marítimo'?'var(--blue)':m==='Aéreo'?'var(--purple)':'var(--teal)'}"><div class="kl">${m}</div><div class="kv">${byModeCount[m]}</div></div>`).join('');

  // Incidencias por Pack Plan: TODOS los Pack Plan del Horizon, no solo los
  // que tuvieron incidencia (reemplaza "Incidencias por mes" — con solo 4-5
  // meses el gráfico se veía casi vacío; por Pack Plan hay muchas más
  // semanas y el gráfico se llena mejor).
  const byPP = {};
  rows.forEach(r=>{ if(r.pack_plan==null) return; byPP[r.pack_plan]=(byPP[r.pack_plan]||0)+1; });
  const allPPWeeks = (HORIZON_RANGE && HORIZON_RANGE.pack_plans && HORIZON_RANGE.pack_plans.length) ? HORIZON_RANGE.pack_plans.slice() : Object.keys(byPP).map(Number).sort((a,b)=>a-b);
  const maxPPCount = Math.max(...allPPWeeks.map(k=>byPP[k]||0), 1);

  // Incidencias por proveedor: muchos proveedores → barras horizontales (más legible que un donut)
  const bySupplier = {};
  rows.forEach(r=>{ const k=r.supplier||'(sin dato)'; bySupplier[k]=(bySupplier[k]||0)+1; });
  const supplierEntries = Object.entries(bySupplier).sort((a,b)=>b[1]-a[1]);
  const maxSupplier = Math.max(...supplierEntries.map(([,v])=>v), 1);

  // Incidencias por tipo de proveedor: pocas categorías → donut
  const byTSupplier = {};
  rows.forEach(r=>{ const k=r.t_supplier||'(sin dato)'; byTSupplier[k]=(byTSupplier[k]||0)+1; });
  const tSupplierPalette = ['var(--amber)','var(--blue)','var(--purple)','var(--teal)','var(--bad)','var(--ok)'];
  const tSupplierEntries = Object.entries(byTSupplier).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({name:k,val:v,color:tSupplierPalette[i%tSupplierPalette.length]}));

  const byPersona = {};
  rows.forEach(r=>{ const k=r.persona||'(sin dato)'; byPersona[k]=(byPersona[k]||0)+1; });
  const personaEntries = Object.entries(byPersona).sort((a,b)=>b[1]-a[1]);
  const maxPersona = Math.max(...personaEntries.map(([,v])=>v), 1);

  // Incidencias por criticidad: hoy solo se veía el promedio (un número); este
  // desglose 1-5 dice de dónde viene ese promedio (¿son puras leves, o hay
  // varias Muy Graves escondidas detrás de un promedio bajo?).
  const critColors = ['var(--ink-faint)','var(--ok)','var(--teal)','var(--warn)','var(--bad)','var(--bad)'];
  const byCrit = {};
  rows.forEach(r=>{ const k = r.criticidad==null ? 'null' : String(r.criticidad); byCrit[k]=(byCrit[k]||0)+1; });
  const critLevels = [0,1,2,3,4,5];
  const critEntries = critLevels.map(c=>({ c, v: byCrit[String(c)]||0, label: incCritLabel(c), color: critColors[c] }));
  if (byCrit['null']) critEntries.unshift({ c:null, v: byCrit['null'], label:'Sin registrar', color:'var(--ink-faint)' });
  const maxCrit = Math.max(...critEntries.map(e=>e.v), 1);

  return `
  <div class="kg">
    <div class="kc" style="--acc:var(--bad)"><div class="kl">Incidencias registradas</div><div class="kv">${total}</div></div>
    ${modeCards}
    <div class="kc" style="--acc:var(--warn)"><div class="kl">Criticidad promedio</div><div class="kv">${critAvg}<span class="u">/ 5</span></div></div>
  </div>
  <div class="card">
    <div class="ct">Incidencias por Pack Plan <span class="sub">${allPPWeeks.length} semana(s) de Pack Plan en Horizon</span></div>
    <div class="sc-chart" style="height:170px;">${allPPWeeks.length ? allPPWeeks.map(pp=>{ const v=byPP[pp]||0; const h=Math.max(2, calcPct(v,maxPPCount)); return `<div class="sc-col" style="height:100%;"><span class="sc-val">${v||''}</span><div class="sc-bars" style="height:${h}%;"><div class="seg" style="height:100%;background:${v?'var(--bad)':'var(--line)'};"></div></div><span class="sc-lbl">S${pp}</span></div>`; }).join('') : '<div class="empty-state">Sin datos</div>'}</div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Incidencias por proveedor</div><div class="bars">${supplierEntries.length ? supplierEntries.map(([k,v])=>`<div class="br"><span class="bl">${k}</span><div class="bt"><div class="bf" style="width:${calcPct(v,maxSupplier)}%;background:var(--bad);"></div></div><span class="bv">${v}</span></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>
    <div class="card"><div class="ct">Incidencias por tipo de proveedor</div>
      <div class="donut-wrap">

function incSetMetric(m){
  incMetric = m;
  document.querySelectorAll('.inc-metric-btn').forEach(b=>b.classList.toggle('active', b.dataset.metric===m));
  incRefreshGeneralBody();
}
function incWireGeneralEvents(){ incRefreshGeneralBody(); }

// Devuelve el key por el que se deduplica según la métrica activa —
// "1 PO con 2 incidencias sigue siendo 1 PO afectado" (nunca se cuenta 2 veces).
function incDedupeKey(r){ return incMetric==='instruction' ? (r.instruction||r.po) : (r.po||r.instruction); }

// Afectados (numerador) según la métrica: total y desglose por Pack Plan.
// FCL se deduplica por PO/Instruction (el FCL es propiedad del embarque, no de
// la incidencia — si un embarque tiene 2 incidencias, su FCL solo cuenta 1 vez).
function incComputeAffected(rows){
  if (incMetric === 'fcl'){
    const seen = new Set();
    let total = 0;
    const byPP = {};
    rows.forEach(r=>{
      const key = r.po || r.instruction;
      if (!key || seen.has(key)) return;
      seen.add(key);
      const v = r.fcl || 0;
      total += v;
      if (r.pack_plan!=null) byPP[r.pack_plan] = (byPP[r.pack_plan]||0) + v;
    });
    return { total, byPP };
  }
  const seenTotal = new Set();
  const byPPSets = {};
  rows.forEach(r=>{
    const key = incDedupeKey(r);
    if (!key) return;
    seenTotal.add(key);
    if (r.pack_plan!=null){
      byPPSets[r.pack_plan] = byPPSets[r.pack_plan] || new Set();
      byPPSets[r.pack_plan].add(key);
    }
  });
  const byPP = {};
  Object.entries(byPPSets).forEach(([pp,s])=>{ byPP[pp]=s.size; });
  return { total: seenTotal.size, byPP };
}
// Universo (denominador) según la métrica — siempre TODO Horizon, no solo lo que tuvo incidencia.
function incUniverseTotals(){
  const g = (UNIVERSO_COMPLIANCE && UNIVERSO_COMPLIANCE.general) || {total_instruction:0,total_po:0,total_fcl:0,by_pack_plan_instruction:{},by_pack_plan_po:{},by_pack_plan_fcl:{}};
  if (incMetric==='instruction') return { total: g.total_instruction||0, byPP: g.by_pack_plan_instruction||{} };
  if (incMetric==='po') return { total: g.total_po||0, byPP: g.by_pack_plan_po||{} };
  return { total: g.total_fcl||0, byPP: g.by_pack_plan_fcl||{} };
}
// Afectados por modo, siempre en FCL (para los scorecards de Marítimo/Aéreo,
// que no dependen del toggle Instruction/PO/FCL).
function incAffectedFclByMode(rows, mode){
  const seen = new Set(); let total = 0;
  rows.filter(r=>r.mode===mode).forEach(r=>{
    const key = r.po || r.instruction;
    if (!key || seen.has(key)) return;
    seen.add(key);
    total += (r.fcl||0);
  });
  return total;
}

function incRefreshGeneralBody(){
  const body = document.getElementById('inc-general-body');
  if (!body) return;
  const rows = incFilteredRows();
  const univ = UNIVERSO_COMPLIANCE || {marítimo:{fcl_total:0},aéreo:{fcl_total:0},general:{}};
  const unitLbl = incMetric==='fcl' ? 'FCL' : incMetric==='instruction' ? 'Instructions' : 'PO';
  const fmtU = v => incMetric==='fcl' ? fmt1(v) : v;

  const affected = incComputeAffected(rows);
  const universe = incUniverseTotals();
  const incPct = universe.total ? pct(affected.total, universe.total) : 0;
  const compliancePct = universe.total ? (100-incPct).toFixed(1) : '—';

  const critVals = rows.map(r=>r.criticidad).filter(c=>c!=null);
  const critAvg = critVals.length ? (sum(critVals)/critVals.length).toFixed(1) : '—';

  // Incidencias por Pack Plan — barra apilada de 2 colores (cumplimiento / incumplimiento),
  // sobre TODOS los Pack Plan que existan en Horizon (no solo los que tuvieron incidencia).
  const allPP = (HORIZON_RANGE && HORIZON_RANGE.pack_plans && HORIZON_RANGE.pack_plans.length) ? HORIZON_RANGE.pack_plans : Object.keys(universe.byPP).map(Number).sort((a,b)=>a-b);
  const ppStack = allPP.map(pp=>{
    const tot = universe.byPP[pp] || 0;
    const aff = affected.byPP[pp] || 0;
    return { pp, tot, aff, ok: Math.max(0, tot-aff) };
  });
  const maxPPTot = Math.max(...ppStack.map(p=>p.tot), 1);

  const byPacking = {};
  rows.forEach(r=>{ if(!r.packing) return; const key = incDedupeKey(r); if(!key) return; byPacking[r.packing] = byPacking[r.packing] || new Map(); if(!byPacking[r.packing].has(key)) byPacking[r.packing].set(key, r.fcl||0); });
  const packingEntries = Object.entries(byPacking).map(([k,m])=>[k, incMetric==='fcl' ? sum([...m.values()]) : m.size]).sort((a,b)=>b[1]-a[1]);
  const maxPacking = Math.max(...packingEntries.map(([,v])=>v), 1);

  const byDest = {};
  rows.forEach(r=>{ if(!r.pod) return; const key = incDedupeKey(r); if(!key) return; byDest[r.pod] = byDest[r.pod] || new Map(); if(!byDest[r.pod].has(key)) byDest[r.pod].set(key, r.fcl||0); });
  const destEntries = Object.entries(byDest).map(([k,m])=>[k, incMetric==='fcl' ? sum([...m.values()]) : m.size]).sort((a,b)=>b[1]-a[1]);
  const maxDest = Math.max(...destEntries.map(([,v])=>v), 1);

  // Split de incidencias por modo — misma métrica activa (FCL/Instruction/PO), deduplicado.
  const modeOrder = ['Marítimo','Aéreo','Terrestre'];
  const modeColorsInc = {'Marítimo':'var(--blue)','Aéreo':'var(--purple)','Terrestre':'var(--teal)'};
  const byModeMap = {};
  rows.forEach(r=>{ if(!r.mode) return; const key = incDedupeKey(r); if(!key) return; byModeMap[r.mode] = byModeMap[r.mode] || new Map(); if(!byModeMap[r.mode].has(key)) byModeMap[r.mode].set(key, r.fcl||0); });
  const modeSplit = Object.keys(byModeMap).sort((a,b)=>modeOrder.indexOf(a)-modeOrder.indexOf(b))
    .map(m=>({ mode:m, val: incMetric==='fcl' ? sum([...byModeMap[m].values()]) : byModeMap[m].size, color: modeColorsInc[m]||'var(--ink-faint)' }));
  const modeSplitTotal = sum(modeSplit.map(s=>s.val)) || 1;

  body.innerHTML = `
  <div class="kg">
    <div class="kc"><div class="kl">General Shipments (universo)</div><div class="kv">${fmtU(universe.total)}<span class="u">${unitLbl}</span></div></div>
    <div class="kc" style="--acc:var(--bad)"><div class="kl">Con incidencia</div><div class="kv">${fmtU(affected.total)}<span class="u">${unitLbl}</span></div><div class="kf">${incPct}%</div></div>
    <div class="kc" style="--acc:var(--ok)"><div class="kl">General Compliance %</div><div class="kv">${compliancePct}<span class="u">%</span></div><div class="kf">${fmtU(universe.total-affected.total)}/${fmtU(universe.total)} sin incidencia</div></div>
    <div class="kc" style="--acc:var(--warn)"><div class="kl">Criticidad promedio</div><div class="kv">${critAvg}<span class="u">/ 5</span></div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start;margin-bottom:14px;">
    <div class="card" style="margin-bottom:0;">
      <div class="ct">Incidencias por Pack Plan <span class="sub">métrica: ${unitLbl} · cumplimiento vs. incumplimiento</span></div>
      <div class="sc-chart" style="height:280px;">${ppStack.length ? ppStack.map(p=>{
        const h = Math.max(2, calcPct(p.tot, maxPPTot));
        const okPct = p.tot ? (p.ok/p.tot*100).toFixed(1) : 0;
        const affPct = p.tot ? (p.aff/p.tot*100).toFixed(1) : 0;
        return `<div class="sc-col" style="height:100%;"><span class="sc-val">${p.tot?fmtU(p.tot):''}</span><div class="sc-bars" style="height:${h}%;"><div class="seg" style="height:${affPct}%;background:var(--bad);"></div><div class="seg" style="height:${okPct}%;background:var(--ok);"></div></div><span class="sc-lbl">S${p.pp}</span></div>`;
      }).join('') : '<div class="empty-state">Sin datos</div>'}</div>
      <div style="display:flex;gap:14px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);">
        <div style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:2px;background:var(--ok);"></span>Cumplimiento</div>
        <div style="display:flex;align-items:center;gap:6px;"><span style="width:8px;height:8px;border-radius:2px;background:var(--bad);"></span>Incumplimiento</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:0;min-width:0;"><div class="ct">Incidencias por destino (POD)</div><div>${destEntries.length ? destEntries.map(([k,v])=>`<div class="wep-top-dest-row"><div class="hd"><span>${k}</span><span class="mono" style="color:var(--bad);">${fmtU(v)}</span></div><div class="bt"><div class="bf" style="width:${calcPct(v,maxDest)}%;background:var(--bad);"></div></div></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>
  </div>
  <div class="g2">
    <div class="card" style="margin-bottom:0;"><div class="ct">Incidencias por Packing (planta) <span class="sub">métrica: ${unitLbl}</span></div><div class="bars">${packingEntries.length ? packingEntries.map(([k,v])=>`<div class="br"><span class="bl">${k}</span><div class="bt"><div class="bf" style="width:${calcPct(v,maxPacking)}%;background:var(--purple);"></div></div><span class="bv">${fmtU(v)}</span></div>`).join('') : '<div class="empty-state">Sin datos</div>'}</div></div>
    <div class="card" style="margin-bottom:0;">
      <div class="ct">Split de incidencias por modo <span class="sub">métrica: ${unitLbl}</span></div>
      ${modeSplit.length ? `
      <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;">${modeSplit.map(s=>`<div style="width:${(s.val/modeSplitTotal*100).toFixed(1)}%;background:${s.color};"></div>`).join('')}</div>
      ${modeSplit.map(s=>`<div style="display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12.5px;"><span style="width:9px;height:9px;border-radius:2px;background:${s.color};flex-shrink:0;"></span><span style="flex:1;">${s.mode}</span><span class="mono" style="font-weight:600;">${fmtU(s.val)}</span></div>`).join('')}
      ` : '<div class="empty-state">Sin datos</div>'}
    </div>
  </div>
  <div class="card">
    <div class="ct">Incidencias vinculadas — detalle</div>
    <div class="tbl-scroll"><table class="std"><thead><tr><th>ID Incidencia</th><th>Pack Plan</th><th>ID/PO</th><th>Modo</th><th>Packing</th><th>POD</th><th style="text-align:right">FCL</th><th>Incidencia</th><th>Criticidad</th></tr></thead>
    <tbody>${rows.length ? rows.map(r=>`<tr><td class="mono">${r.id_incident}</td><td class="mono">S${r.pack_plan??'—'}</td><td class="mono">${r.id_po}</td><td>${r.mode||'—'}</td><td>${r.packing||'—'}</td><td>${r.pod||'—'}</td><td class="mono" style="text-align:right">${r.fcl!=null?fmt1(r.fcl):'—'}</td><td>${r.incident||'—'}</td><td><span class="inc-crit ${incCritClass(r.criticidad)}">${r.criticidad??'—'}</span></td></tr>`).join('') : '<tr><td colspan="9" class="empty-state">Sin incidencias vinculadas a un embarque todavía</td></tr>'}</tbody></table></div>
  </div>`;
}

/* ---------------- MARÍTIMO / AÉREO (misma lógica, distinto campo) ---------------- */
function incRenderModo(modeName, universeKey, univKey){
  const rows = incFilteredRows().filter(r=>r.matched && r.mode===modeName);
  const univ = UNIVERSO_COMPLIANCE ? UNIVERSO_COMPLIANCE[univKey] : {[universeKey]:0, by_pack_plan:{}};
  const totalUniverse = univ ? (univ[universeKey]||0) : 0;
  const idsConIncidencia = new Set(rows.map(r=>r.id_po));
  const incPct = totalUniverse ? pct(idsConIncidencia.size, totalUniverse) : 0;
  const compliancePct = totalUniverse!=null ? (100-incPct).toFixed(1) : '—';
  const unitLbl = (modeName==='Marítimo' || modeName==='Terrestre') ? 'Instructions' : 'PO';

  const byPP = univ ? (univ.by_pack_plan||{}) : {};
  const ppKeys = Object.keys(byPP).map(Number).sort((a,b)=>a-b);
  const incByPP = {};
  rows.forEach(r=>{ if(r.pack_plan==null) return; incByPP[r.pack_plan] = incByPP[r.pack_plan] || new Set(); incByPP[r.pack_plan].add(r.id_po); });
  const pctByPP = ppKeys.map(pp=>({ pp, pct: byPP[pp] ? pct((incByPP[pp]?incByPP[pp].size:0), byPP[pp]) : 0, n:(incByPP[pp]?incByPP[pp].size:0), tot: byPP[pp]||0 }));
  const maxPctVal = Math.max(...pctByPP.map(p=>p.pct), 5);

  // Curva histórica (línea) — % de incumplimiento por semana
  const W=900,H=220,pL=34,pB=24,pT=10;
  const pts = pctByPP.map((p,i)=>({x: pL + i*(W-pL-14)/Math.max(pctByPP.length-1,1), y: H-pB-(p.pct/Math.max(maxPctVal,1))*(H-pT-pB), ...p}));
  const modeColor = modeName==='Marítimo' ? 'var(--blue)' : modeName==='Terrestre' ? 'var(--teal)' : 'var(--purple)';
  const pathOf = arr => arr.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const grid = [0,.5,1].map(f=>{ const y=pT+(1-f)*(H-pT-pB); return `<line x1="${pL}" y1="${y.toFixed(0)}" x2="${W-4}" y2="${y.toFixed(0)}" stroke="var(--line)" stroke-width="1"/><text x="${pL-6}" y="${(y+3).toFixed(0)}" text-anchor="end" font-size="9" fill="var(--ink-faint)" font-family="JetBrains Mono">${Math.round(maxPctVal*f)}%</text>`; }).join('');
  const xlbls = pts.map(p=>`<text x="${p.x.toFixed(0)}" y="${H-6}" text-anchor="middle" font-size="8.5" fill="var(--ink-soft)" font-family="JetBrains Mono">S${p.pp}</text>`).join('');

  const byResp = {};
  rows.forEach(r=>{ const k = r.t_supplier||'(sin dato)'; byResp[k] = byResp[k] || {}; const k2 = r.supplier||'(sin dato)'; byResp[k][k2]=(byResp[k][k2]||0)+1; });

  // Fulfillment of the Assignment — % de incumplimiento por proveedor (Line):
  // de todas las Instructions/PO que Horizon le asignó a esa naviera/aerolínea/
  // transportista, cuántas terminaron con al menos 1 incidencia. A diferencia
  // de "Historic Compliance per Pack Plan" (que mide el modo completo en el
  // tiempo), esto mide a cada proveedor puntualmente — de mayor a menor
  // incumplimiento, y sin mostrar a los que están en 0%.
  const totalByLine = (univ && univ.by_line) || {};
  const affByLine = {};
  rows.forEach(r=>{ const line = r.line || '(sin línea)'; affByLine[line] = affByLine[line] || new Set(); affByLine[line].add(r.id_po); });
  const fulfillment = Object.entries(totalByLine)
    .map(([line,tot])=>{ const aff = affByLine[line] ? affByLine[line].size : 0; return { line, tot, aff, pct: tot ? +(aff/tot*100).toFixed(1) : 0 }; })
    .filter(p=>p.pct>0)
    .sort((a,b)=>b.pct-a.pct);
  const maxFulfillPct = Math.max(...fulfillment.map(p=>p.pct), 5);

  return `
  <div class="kg">
    <div class="kc"><div class="kl">Total ${unitLbl}</div><div class="kv">${totalUniverse}</div></div>
    <div class="kc" style="--acc:var(--bad)"><div class="kl">${unitLbl} con incidencia</div><div class="kv">${idsConIncidencia.size}</div><div class="kf">${incPct}%</div></div>
    <div class="kc" style="--acc:var(--ok)"><div class="kl">Compliance ${modeName} %</div><div class="kv">${compliancePct}<span class="u">%</span></div></div>
  </div>
  <div class="card">
    <div class="ct">Historic Compliance per Pack Plan <span class="sub">% incumplimiento (${unitLbl})</span></div>
    <div style="position:relative;">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:${H}px;display:block;margin:0 auto;" preserveAspectRatio="xMidYMid meet">
        ${grid}
        <path d="${pathOf(pts)}" fill="none" stroke="${modeColor}" stroke-width="2.2"/>
        ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.4" fill="${modeColor}" stroke="var(--surface)" stroke-width="1.2" class="inc-modo-dot" data-pp="${p.pp}" data-pct="${p.pct}" data-n="${p.n}" data-tot="${p.tot}" style="cursor:pointer;"/>`).join('')}
        ${xlbls}
      </svg>
    </div>
  </div>
  <div class="card">
    <div class="ct">Fulfillment of the Assignment (${modeName}) <span class="sub">% incumplimiento por proveedor · mayor a menor</span></div>
    <div class="sc-chart" style="height:190px;">${fulfillment.length ? fulfillment.map(p=>{
      const h = Math.max(2, calcPct(p.pct, maxFulfillPct));
      return `<div class="sc-col" style="height:100%;"><span class="sc-val">${p.pct}%</span><div class="sc-bars" style="height:${h}%;"><div class="seg" style="height:100%;background:${p.pct>10?'var(--bad)':'var(--warn)'};"></div></div><span class="sc-lbl" title="${p.line}">${p.line}</span></div>`;
    }).join('') : '<div class="empty-state">Ningún proveedor tiene incumplimientos registrados</div>'}</div>
  </div>
  <div class="card">
    <div class="ct">Incidents Detail (${modeName})</div>
    <div class="tbl-scroll"><table class="std"><thead><tr><th>ID/PO</th><th>Pack Plan</th><th>Packing</th><th>Fecha</th><th>Incidencia</th><th>Criticidad</th><th>Responsable</th></tr></thead>
    <tbody>${rows.length ? rows.map(r=>`<tr><td class="mono">${r.id_po}</td><td class="mono">S${r.pack_plan??'—'}</td><td>${r.packing||'—'}</td><td class="mono">${r.dispatch_date||'—'}</td><td>${r.incident||'—'}</td><td><span class="inc-crit ${incCritClass(r.criticidad)}">${r.criticidad??'—'}</span></td><td>${r.t_supplier||'—'}${r.supplier?' · '+r.supplier:''}</td></tr>`).join('') : `<tr><td colspan="7" class="empty-state">Sin incidencias registradas en ${modeName} todavía</td></tr>`}</tbody></table></div>

// El backend de Render está en el plan gratuito: se "duerme" tras ~15 min sin
// uso, y la primera petición después de eso puede tardar 50+ segundos en
// responder (a veces más de lo que el navegador espera antes de rendirse con
// "Failed to fetch"). Para que ningún usuario (proveedor incluido) tenga que
// saber esto ni abrir ningún link a mano, "despertamos" el backend en
// silencio ANTES de mandar el Excel real, con reintentos y una barra de
// espera visible, para que quede claro que no se congeló la página.
async function wakeUpBackend(statusEl, maxWaitMs){
  maxWaitMs = maxWaitMs || 70000;
  const base = new URL(UPLOAD_API).origin; // https://athena-api-pxm7.onrender.com
  const t0 = Date.now();
  let attempt = 0;
  while (Date.now() - t0 < maxWaitMs){
    attempt++;
    const elapsed = Math.round((Date.now()-t0)/1000);
    statusEl.innerHTML = `<span style="color:var(--ink-soft);">⏳ Conectando con el servidor… (${elapsed}s — si estaba inactivo, puede tardar hasta 1 minuto la primera vez)</span>`;
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 10000);
      const r = await fetch(base + '/', {method:'GET', signal: ctrl.signal});
      clearTimeout(timer);
      if (r.ok) return true;
    } catch(e) { /* sigue durmiendo o hubo un hiccup — reintenta */ }
    await new Promise(res=>setTimeout(res, 2000));
  }
  return false;
}

async function doUpload(target){
  const cfg = UPLOAD_TARGETS[target];
  const inp = document.getElementById(cfg.fileInput);
  const statusEl = document.getElementById(cfg.status);
  const btn = document.getElementById(cfg.btn);
  if(!inp.files.length){ statusEl.innerHTML = '<span style="color:var(--bad);">Selecciona un archivo primero.</span>'; return; }
  const file = inp.files[0];
  btn.disabled = true; btn.textContent = '⏳ Procesando…';

  const awake = await wakeUpBackend(statusEl);
  if (!awake){
    btn.disabled = false; btn.textContent = '⬆ Procesar y Publicar';
    statusEl.innerHTML = '<span style="color:var(--bad);">❌ El servidor no respondió después de 1 minuto. Intenta de nuevo en unos segundos.</span>';
    return;
  }

  btn.textContent = '⏳ Procesando… (puede tardar ~1 min)';
  statusEl.innerHTML = '<span style="color:var(--ink-soft);">Subiendo y procesando el Excel, por favor espera…</span>';

  const fd = new FormData(); fd.append('file', file);
  fetch(cfg.api, {method:'POST', headers:{'X-API-Key':UPLOAD_API_KEY}, body:fd})
    .then(r=>r.json().then(data=>({ok:r.ok,data})))
    .then(({ok,data})=>{
      btn.disabled = false; btn.textContent = '⬆ Procesar y Publicar';
      if(!ok){
        // El backend responde error (incluido 502) si Supabase — la fuente real
        // que lee este dashboard — no se pudo actualizar, aunque el respaldo a
        // GitHub haya funcionado. Sin este chequeo, un fallo silencioso de
        // Supabase se veía como "✅ Publicado" sin que nada cambiara al refrescar.
        statusEl.innerHTML = `<span style="color:var(--bad);">❌ Error: ${data.error||'algo salió mal'}</span>`;
        return;
      }
      const commitSha = target==='transportes' ? data.commit_sha : (data.github && data.github.info);
      const extra = target==='transportes' && data.rows_processed!=null ? ` · ${data.rows_processed} filas` : '';
      const commitTxt = commitSha ? ` (commit ${String(commitSha).slice(0,7)})` : '';
      statusEl.innerHTML = `<span style="color:var(--ok);">✅ Publicado correctamente${commitTxt}${extra}. Refresca para ver los datos nuevos.</span>`;
    })
    .catch(err=>{
      btn.disabled = false; btn.textContent = '⬆ Procesar y Publicar';
      statusEl.innerHTML = `<span style="color:var(--bad);">❌ Error de conexión: ${err.message}</span>`;
    });
}

/* ============================================================
   # 10b HELPERS — portados literalmente de control_tower_transporte
   (countBy/avg/pct/groupCategorical/groupAvg/weeklyAvg), para que las
   3 vistas de Transporte calculen los KPIs exactamente igual que en
   producción, ahora sobre TRANSPORT_RAW (real, fila a fila).
   ============================================================ */
function countBy(rows, field){
  const o = {};
  rows.forEach(r => { const v = r[field]; if (v != null) o[v] = (o[v]||0)+1; });
  return o;
}
function avgField(rows, field){
  const vals = rows.map(r => r[field]).filter(v => v != null);
  if (!vals.length) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function pct(n, total){ return total ? +(n/total*100).toFixed(1) : 0; }
function groupCategorical(rows, groupField, catField){
  const base = {};
  rows.forEach(r => {
    const g = r[groupField], c = r[catField];
    if (g == null || c == null) return;
    base[g] = base[g] || {}; base[g][c] = (base[g][c]||0)+1;
  });
  return base;
}
function groupOnLate(rows, groupField, catField, okValues){
  const g = groupCategorical(rows, groupField, catField);
  const out = {};
  Object.keys(g).forEach(k=>{
    const total = Object.values(g[k]).reduce((a,b)=>a+b,0);
    const on = okValues.reduce((a,ok)=>a+(g[k][ok]||0),0);
    out[k] = {on, late: total-on, total};
  });
  return out;
}
function weeklyCount(rows){
  const o = {}; rows.forEach(r => { o[r.pp] = (o[r.pp]||0)+1; });
  const weeks = Object.keys(o).map(Number).sort((a,b)=>a-b);
  return { labels: weeks.map(w=>'S'+w), data: weeks.map(w=>o[w]) };
}

/* ============================================================
   # 10a PICKUP — versión completa (KPIs con barra de progreso,
   detención por almacén con Chart.js, cumplimiento por puerto y
   naviera, tendencia semanal, y banner de calidad de datos que
   excluye outliers reales de los promedios), portada del Stage 01
   de control_tower_transporte__4_.html. Dataset real: TRANSPORT_RAW.
   ============================================================ */
function trGroupDetention(rows, groupField, detField){
  const g = {};
  rows.forEach(r=>{
    const key = r[groupField]; const cat = r[detField];
    if(!key || !cat) return;
    g[key] = g[key] || {STANDARD:0, HIGH:0, CRITICAL:0};
    if(g[key][cat]!==undefined) g[key][cat]++;
  });
  return g;
}
// Reglas de calidad de datos por campo — igual que etl_logic_transportes.py
// (DATA_QUALITY_RULES): (mínimo, máximo válido, motivo legible).
const DQ_RULES = {
  emptyOutboundH:   {lo:0, hi:96, reason:'Arrival at plant occurs before route start, or transit exceeds 4 days'},
  routeStartDelayH: {lo:0, hi:48, reason:'Route start occurs before warehouse departure, or delay exceeds 2 days'},
  checkInDelayH:    {lo:0, hi:24, reason:'Check-in delay is negative or exceeds 24 hours'},
  entryDelayH:      {lo:0, hi:24, reason:'Entry delay is negative or exceeds 24 hours'},
  fullInboundH:     {lo:0, hi:96, reason:'Arrival at port occurs before departure from plant, or transit exceeds 4 days'},
  detGateOutH:      {lo:0, hi:48, reason:'Detention time at gate-out is negative or exceeds 2 days'},
  tiempoCargaMin:   {lo:0, hi:720, reason:'Loading time is negative or exceeds 12 hours'},
  detPackingH:      {lo:0, hi:48, reason:'Detention time at packing is negative or exceeds 2 days'},
};
const DQ_FIELD_LABEL = {
  emptyOutboundH:'Empty Outbound Time', routeStartDelayH:'Route Start Delay', checkInDelayH:'Check-In Delay',
  entryDelayH:'Entry Delay', fullInboundH:'Full Inbound Time', detGateOutH:'Gate-Out Detention',
  tiempoCargaMin:'Loading Time', detPackingH:'Detention at Packing',
};
function trAvgFiltered(rows, field){
  const rule = DQ_RULES[field] || {lo:0, hi:Infinity};
  const valid = [], excluded = [];
  rows.forEach(r=>{
    const v = r[field];
    if(v===null || v===undefined) return;
    if(v < rule.lo || v > rule.hi) excluded.push({field, value:v, pp:r.pp, sede:r.sede, instruction:r.instruction});
    else valid.push(v);
  });
  return { avg: valid.length ? sum(valid)/valid.length : null, validCount: valid.length, excluded };
}
function trComplianceByGroup(rows, groupField, complianceField, detHField){
  const rule = DQ_RULES[detHField] || {lo:0, hi:Infinity};
  const g = {};
  rows.forEach(r=>{
    const key = r[groupField];
    if(!key) return;
    g[key] = g[key] || { on:0, late:0, detSum:0, detCount:0 };
    const c = r[complianceField];
    if(c==='ON TIME') g[key].on++; else if(c==='LATE') g[key].late++;
    if(detHField && r[detHField]!=null && r[detHField]>=rule.lo && r[detHField]<=rule.hi){ g[key].detSum += r[detHField]; g[key].detCount++; }
  });
  return Object.entries(g).map(([name,v])=>({
    name, total: v.on+v.late, latePct: (v.on+v.late)?pct(v.late,v.on+v.late):0,
    avgDet: v.detCount ? v.detSum/v.detCount : null,
  })).sort((a,b)=>b.total-a.total);
}
function trComplianceCritByGroup(rows, groupField, complianceField, detField){
  const g = {};
  rows.forEach(r=>{
    const key = r[groupField];
    if(!key) return;
    g[key] = g[key] || { on:0, late:0, crit:0, detTotal:0 };
    const c = r[complianceField];
    if(c==='ON TIME') g[key].on++; else if(c==='LATE') g[key].late++;
    const d = r[detField];
    if(d){ g[key].detTotal++; if(d==='CRITICAL') g[key].crit++; }
  });
  return Object.entries(g).map(([name,v])=>({
    name, total: v.on+v.late, latePct: (v.on+v.late)?pct(v.late,v.on+v.late):0,
    critPct: v.detTotal ? pct(v.crit,v.detTotal) : 0,
  })).sort((a,b)=>b.total-a.total);
}
function trDataQualityBadge(rows, affectedTotal, containerId){
  return `<div class="dq-banner" onclick="document.getElementById('${containerId}').classList.toggle('open')">
    <span>⚠ Data quality: ${rows.length - affectedTotal} de ${rows.length} registros sin observaciones · ${affectedTotal} con valores fuera de rango en los promedios</span>
    <span>View details ▾</span>
  </div>`;
}
function trDataQualityDetails(excludedArrays){
  // excludedArrays: arrays de {field,value,pp,sede,instruction} (uno por trAvgFiltered llamado)
  const rows = excludedArrays.flat();
  if (!rows.length) return '<div style="padding:4px 2px;">No se excluyó ningún valor con los filtros actuales.</div>';
  return `<div class="tbl-wrap"><table class="std" style="font-size:11px;"><thead><tr><th>Instruction</th><th>Pack Plan</th><th>Site</th><th>Field</th><th style="text-align:right">Raw Value</th><th>Reason</th></tr></thead>
  <tbody>${rows.map(r=>{
    const rule = DQ_RULES[r.field];
    return `<tr><td class="mono">${r.instruction||'—'}</td><td class="mono">${r.pp!=null?r.pp:'—'}</td><td>${r.sede||'—'}</td><td>${DQ_FIELD_LABEL[r.field]||r.field}</td><td class="mono" style="text-align:right;color:var(--bad);">${typeof r.value==='number'?r.value.toFixed(2):r.value}</td><td style="white-space:normal;max-width:320px;">${rule?rule.reason:'—'}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

  const routeStats = trAvgFiltered(rows, 'routeStartDelayH');
  const excludedTotal = new Set([...emptyStats.excluded, ...routeStats.excluded].map(e=>e.instruction||e.pp+'-'+e.sede)).size;

  const almGroups = trGroupDetention(rows, 'almacenRetiro', 'detentionGateOut');
  const almLabels = Object.keys(almGroups).sort((a,b)=>{
    const totA = almGroups[a].STANDARD+almGroups[a].HIGH+almGroups[a].CRITICAL;
    const totB = almGroups[b].STANDARD+almGroups[b].HIGH+almGroups[b].CRITICAL;
    return totB-totA;
  });
  // Tiempo promedio de detention por almacén (mismo criterio de descarte de
  // outliers que ya se usa para portStats más abajo), para mostrarlo junto

  const almAvgDet = {};
  almLabels.forEach(l=>{

    almAvgDet[l] = dr.length ? sum(dr)/dr.length : null;

  const portStats = trComplianceCritByGroup(rows, 'puertoRetiro', 'gateOutCompliance', 'detentionGateOut').map(p=>({...p, avgDet: (()=>{ const dr=rows.filter(r=>r.puertoRetiro===p.name && r.detGateOutH!=null && r.detGateOutH>=0 && r.detGateOutH<=72).map(r=>r.detGateOutH); return dr.length ? sum(dr)/dr.length : null; })() }));
  const lineStats = trComplianceCritByGroup(rows, 'naviera', 'gateOutCompliance', 'detentionGateOut');
  const wk = weeklyCount(rows);

  window.build_chRetiroAlmacen = () => mountChart('chRetiroAlmacen', {

      {label:'Standard', data: almLabels.map(l=>almGroups[l].STANDARD), backgroundColor: chartColor('--ok')},
      {label:'High', data: almLabels.map(l=>almGroups[l].HIGH), backgroundColor: chartColor('--warn')},
      {label:'Critical', data: almLabels.map(l=>almGroups[l].CRITICAL), backgroundColor: chartColor('--bad')},
    ]},
    options: baseChartOptions({
      indexAxis:'y',
      plugins:{
        legend:{ labels:{ color:chartColor('--ink-soft'), font:{family:'Instrument Sans', size:11} } },
        tooltip:{ callbacks:{ footer: items=>{
          const l = items[0].label;
          const avg = almAvgDet[l];
          return avg!=null ? `Tiempo promedio: ${avg.toFixed(1)}h` : 'Tiempo promedio: sin datos';
        } } },
      },
      scales:{ x:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{color:chartColor('--line')}}, y:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{display:false}} },
    }),

   Dataset real: TRANSPORT_RAW.

function trAvgSigned(rows, field, capAbs){
  capAbs = capAbs || 720;
  const valid = rows.map(r=>r[field]).filter(v=>v!=null && Math.abs(v)<=capAbs);
  return valid.length ? sum(valid)/valid.length : null;
}
function trWeeklyAvg(rows, field, filterFn){
  const g = {};
  rows.forEach(r=>{
    const v = r[field];
    if (v==null || (filterFn && !filterFn(v))) return;
    g[r.pp] = g[r.pp] || [];
    g[r.pp].push(v);
  });
  const weeks = Object.keys(g).map(Number).sort((a,b)=>a-b);
  return { labels: weeks.map(w=>'PP'+w), data: weeks.map(w=>+(sum(g[w])/g[w].length).toFixed(2)) };
}
function minutesToHM(m){
  if (m==null || isNaN(m)) return '–';
  const sign = m<0 ? '-' : '';
  const abs = Math.abs(Math.round(m));
  return `${sign}${Math.floor(abs/60)}h ${abs%60}min`;
}
function trStackedCompliance3(rows, groupField, complianceField){
  const g = {};
  rows.forEach(r=>{
    const key = r[groupField]; const c = r[complianceField];
    if (!key || !c) return;
    g[key] = g[key] || {'ON TIME':0,'LATE':0,'CRITICAL LATE':0};
    if (g[key][c]!==undefined) g[key][c]++;
  });
  return g;
}

function refreshIngreso(){

  if (selSede) rows = rows.filter(r=>selSede.includes(r.sede));
  if (selCar) rows = rows.filter(r=>selCar.includes(r.transportista));

  const gateIn = countBy(rows, 'gateInCompliance');
  const gateInTotal = (gateIn['ON TIME']||0) + (gateIn['LATE']||0);
  const onTimePct = pct(gateIn['ON TIME']||0, gateInTotal);
  const latePct = pct(gateIn['LATE']||0, gateInTotal);

  const detGI = countBy(rows, 'detentionGateIn');
  const detGITotal = (detGI['STANDARD']||0)+(detGI['HIGH']||0)+(detGI['CRITICAL']||0);
  const stdPct = pct(detGI['STANDARD']||0, detGITotal);
  const highPct = pct(detGI['HIGH']||0, detGITotal);
  const critPct = pct(detGI['CRITICAL']||0, detGITotal);

  const fullInboundStats = trAvgFiltered(rows, 'fullInboundH');
  const excludedTotal = new Set(fullInboundStats.excluded.map(e=>e.instruction||e.pp+'-'+e.sede)).size;

  const almGroups = trGroupDetention(rows, 'almacenIngreso', 'detentionGateIn');
  const almLabels = Object.keys(almGroups).sort((a,b)=>{
    const totA = almGroups[a].STANDARD+almGroups[a].HIGH+almGroups[a].CRITICAL;
    const totB = almGroups[b].STANDARD+almGroups[b].HIGH+almGroups[b].CRITICAL;
    return totB-totA;
  });

  const portStats = (() => {
    const g = {};
    rows.forEach(r=>{ const key=r.puertoIngreso; if(!key) return; g[key]=g[key]||{on:0,total:0}; const c=r.gateInCompliance; if(c){ g[key].total++; if(c==='ON TIME') g[key].on++; } });
    return Object.entries(g).map(([name,v])=>({name, total:v.total, onTimePct: v.total?pct(v.on,v.total):0})).sort((a,b)=>b.total-a.total);
  })();

  const carrierGroup = (() => {
    const g = {};
    rows.forEach(r=>{ const key=r.transportista; if(!key) return; g[key]=g[key]||{on:0,late:0}; const c=r.gateInCompliance; if(c==='ON TIME') g[key].on++; else if(c==='LATE') g[key].late++; });
    return g;

  const carrierLabels = Object.keys(carrierGroup).sort((a,b)=>{
    const totA = carrierGroup[a].on+carrierGroup[a].late, totB = carrierGroup[b].on+carrierGroup[b].late;
    return totB-totA;
  });

  const lineStats = (() => {
    const g = {};
    rows.forEach(r=>{ const key=r.naviera; if(!key) return; g[key]=g[key]||{on:0,total:0,crit:0,detTotal:0}; const c=r.gateInCompliance; if(c){ g[key].total++; if(c==='ON TIME') g[key].on++; } const d=r.detentionGateIn; if(d){ g[key].detTotal++; if(d==='CRITICAL') g[key].crit++; } });
    return Object.entries(g).map(([name,v])=>({name, total:v.total, onTimePct: v.total?pct(v.on,v.total):0, critPct: v.detTotal?pct(v.crit,v.detTotal):0})).sort((a,b)=>b.total-a.total);
  })();

  const wk = weeklyCount(rows);

  window.build_chIngresoAlmacen = () => mountChart('chIngresoAlmacen', {
    type:'bar',
    data:{ labels: almLabels, datasets:[
      {label:'Standard', data: almLabels.map(l=>almGroups[l].STANDARD), backgroundColor: chartColor('--ok')},
      {label:'High', data: almLabels.map(l=>almGroups[l].HIGH), backgroundColor: chartColor('--warn')},
      {label:'Critical', data: almLabels.map(l=>almGroups[l].CRITICAL), backgroundColor: chartColor('--bad')},
    ]},
    options: baseChartOptions({ indexAxis:'y', scales:{ x:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{color:chartColor('--line')}}, y:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{display:false}} } }),
  });
  window.build_chIngresoCarrier = () => mountChart('chIngresoCarrier', {
    type:'bar',
    data:{ labels: carrierLabels, datasets:[
      {label:'On Time', data: carrierLabels.map(l=>carrierGroup[l].on), backgroundColor: chartColor('--ok')},
      {label:'Late', data: carrierLabels.map(l=>carrierGroup[l].late), backgroundColor: chartColor('--bad')},
    ]},
    options: baseChartOptions({ indexAxis:'y', scales:{ x:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{color:chartColor('--line')}}, y:{stacked:true, ticks:{color:chartColor('--ink-faint'),font:{family:'JetBrains Mono',size:9.5}}, grid:{display:false}} } }),
  });
  window.build_chIngresoWeekly = () => mountChart('chIngresoWeekly', lineConfig(wk.labels, wk.data, chartColor('--teal')));

  document.getElementById('ingreso-content').innerHTML = `
  <span class="mock-tag">◆ ${TRANSPORT_RAW ? "Datos en vivo — sb.from('transport_data')" : 'Datos reales (fallback local)'} · ${rows.length} de ${all.length} registros</span>
  ${trDataQualityBadge(rows, excludedTotal, 'ingreso-dq-details')}
  <div class="dq-details" id="ingreso-dq-details">
    ${trDataQualityDetails([fullInboundStats.excluded])}
  </div>
  <div class="ph" style="margin-bottom:14px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
      <div>
        <h2 style="margin:0;font-size:20px;">Receiving Process</h2>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:3px;">Stage 3 · Gate-In — desde la cita de ingreso hasta la salida del almacén portuario</div>
      </div>
      <span class="stage-badge-count">${rows.length} SHIPMENTS · ${gateInTotal} WITH RECORDED APPOINTMENT</span>
    </div>
  </div>
  <div class="kg">
    <div class="kc" style="--acc:${onTimePct>=50?'var(--ok)':'var(--bad)'}">
      <div class="kl">Gate-In Appointment Compliance</div><div class="kv">${onTimePct}<span class="u">% on time</span></div>
      <div class="kf"><span class="pill bad">${latePct}% LATE</span></div>
      <div class="kpi-progress"><div class="seg" style="width:${onTimePct}%;background:var(--ok);"></div><div class="seg" style="width:${latePct}%;background:var(--bad);"></div></div>
    </div>
    <div class="kc" style="--acc:var(--ok)">
      <div class="kl">Detention at Gate-In Storage</div><div class="kv">${stdPct}<span class="u">% standard</span></div>
      <div class="kf"><span class="pill warn">${highPct}% HIGH</span> <span class="pill bad">${critPct}% CRITICAL</span></div>
      <div class="kpi-progress"><div class="seg" style="width:${stdPct}%;background:var(--ok);"></div><div class="seg" style="width:${highPct}%;background:var(--warn);"></div><div class="seg" style="width:${critPct}%;background:var(--bad);"></div></div>
    </div>
    <div class="kc" style="--acc:var(--teal)"><div class="kl">Full Inbound Time</div><div class="kv">${fullInboundStats.avg!=null?fullInboundStats.avg.toFixed(2):'–'}<span class="u">h avg.</span></div><div class="kf">Total Receiving Cycle</div></div>
    <div class="kc" style="--acc:var(--blue)"><div class="kl">Containers Received</div><div class="kv">${rows.length}<span class="u">containers</span></div><div class="kf">Con filtros actuales</div></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Detention by Gate-In Warehouse <span class="sub">Standard · High · Critical</span></div><div style="height:280px;"><canvas id="chIngresoAlmacen"></canvas></div></div>
    <div>
      <div class="card"><div class="ct">Compliance by Port <span class="sub">Gate-In on time</span></div>
        <div class="tbl-wrap"><table class="std"><thead><tr><th>Port</th><th style="text-align:right">N°</th><th style="text-align:right">% On Time</th></tr></thead>
        <tbody>${portStats.length ? portStats.map(p=>`<tr><td>${p.name}</td><td class="mono" style="text-align:right">${p.total}</td><td class="mono" style="text-align:right;color:${p.onTimePct>=50?'var(--ok)':'var(--warn)'};">${p.onTimePct}%</td></tr>`).join('') : '<tr><td colspan="3" class="empty-state">Sin datos</td></tr>'}</tbody></table></div>
      </div>
      <div class="card" style="margin-bottom:0;"><div class="ct">By Carrier <span class="sub">On Time vs. Late</span></div><div style="height:${Math.max(140,carrierLabels.length*32)}px;"><canvas id="chIngresoCarrier"></canvas></div></div>
    </div>
  </div>
  <div class="card">
    <div class="ct">Compliance &amp; Detention by Shipping Line <span class="sub">Gate-In</span></div>
    <div class="tbl-wrap"><table class="std"><thead><tr><th>Shipping Line</th><th style="text-align:right">N°</th><th style="text-align:right">% On Time</th><th style="text-align:right">% Crit. Det.</th></tr></thead>
    <tbody>${lineStats.length ? lineStats.map(l=>`<tr><td>${l.name}</td><td class="mono" style="text-align:right">${l.total}</td><td class="mono" style="text-align:right;color:${l.onTimePct>=50?'var(--ok)':'var(--warn)'};">${l.onTimePct}%</td><td class="mono" style="text-align:right">${l.critPct}%</td></tr>`).join('') : '<tr><td colspan="4" class="empty-state">Sin datos</td></tr>'}</tbody></table></div>
  </div>
  <div class="card"><div class="ct">Containers Received by Week <span class="sub">Trend · Pack Plan</span></div><div style="height:280px;max-width:900px;margin:0 auto;"><canvas id="chIngresoWeekly"></canvas></div></div>`;

  window.build_chIngresoAlmacen();
  window.build_chIngresoCarrier();
  window.build_chIngresoWeekly();
}

window.postRender_ingreso = refreshIngreso;

const PANEL_RENDERERS = {
  forecast: renderForecast, ports: renderPorts, wep: renderWEP,
  pmi: renderPMI, air: renderAir, execute: renderExecute,
  retiro: renderRetiro, packing: renderPacking, ingreso: renderIngreso,
  incidencias: renderIncidencias,
  upload: renderUpload,
};
const CHART_VIEWS = { retiro:['chRetiroAlmacen','chRetiroWeekly'], packing:['chPackingDonut','chPackingDispatch','chPackingWeekly','chPackingNaviera'], ingreso:['chIngresoAlmacen','chIngresoCarrier','chIngresoWeekly'] };

function buildPanels(){
  const main = document.getElementById('main');
  main.innerHTML = Object.keys(PANEL_RENDERERS).map(id => `<div class="panel" id="p-${id}"></div>`).join('');
  Object.keys(PANEL_RENDERERS).forEach(id => {
    document.getElementById('p-'+id).innerHTML = PANEL_RENDERERS[id]();
    // Algunas vistas (ej. Forecast) insertan un shell con filtros y contenedores
    // vacíos, y llenan el contenido dinámico recién cuando el shell ya existe
    // en el DOM — igual patrón que usaba AXIS 1.0 (setTimeout tras insertar).
    if (window['postRender_'+id]) window['postRender_'+id]();
  });
  // instanciar Chart.js solo para las vistas de Transporte
  Object.keys(CHART_VIEWS).forEach(view => {
    CHART_VIEWS[view].forEach(chId => { const b = window['build_'+chId]; if(b) b(); });
  });
}

// Reconstruir gráficos (colores) cuando cambia el tema
function redrawChartTheme(){
  Object.keys(CHART_VIEWS).forEach(view => {
    CHART_VIEWS[view].forEach(chId => { const b = window['build_'+chId]; if(b) b(); });
  });
}

// El arranque real ocurre en loadDataAndInit(), disparado por tryLogin()
// tras autenticar contra Supabase (ver bloque #05a más arriba).
</script>
</body>
</html>
