<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ARES · Plataforma Consolidada</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ============================================================
   # 00 TOKENS — sistema de diseño dual (claro = AXIS / oscuro = Weekly Export Program)
   Cambiar [data-theme] en <html> conmuta todas las variables.
   ============================================================ */
:root, [data-theme="light"]{
  --bg:#F6F4EF; --bg-halo: radial-gradient(1200px 600px at 12% -10%, #EFE9DC 0%, #F6F4EF 55%);
  --surface:#FFFFFF; --surface-soft:#FBFAF6;
  --line:#E2DED3; --line-strong:#D3CDBD;
  --ink:#101B26; --ink-soft:#5C6B78; --ink-faint:#93A0AB;

  --navy:#0E2A3D; --navy2:#163B54; --navy-deep:#081420;
  --blue:#2E8FB0; --amber:#E8A33D; --purple:#7A6FD0; --teal:#1F9E92;

  --ok:#2E8B57; --ok-bg:#E5F3EA;
  --warn:#C77D1E; --warn-bg:#FCEFDC;
  --bad:#C0392B; --bad-bg:#FBE5E1;

  --sidebar-bg: linear-gradient(180deg, var(--navy-deep), var(--navy) 82%);
  --sidebar-ink: #A8C4D2; --sidebar-ink-active:#FFFFFF;
  --shadow: 0 1px 2px rgba(16,27,38,.04), 0 8px 24px rgba(16,27,38,.06);
  --radius:14px; --radius-sm:9px;
}
[data-theme="dark"]{
  --bg:#0a121c; --bg-halo: radial-gradient(1200px 600px at 12% -10%, #14293e 0%, #0a121c 60%);
  --surface:#0d1928; --surface-soft:#0e1a28;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --ink:#e6edf5; --ink-soft:#8ba0b6; --ink-faint:#5d7086;

  --navy:#0a121c; --navy2:#14293e; --navy-deep:#060b12;
  --blue:#4fd1c5; --amber:#f0b357; --purple:#a8c8f0; --teal:#4fd1c5;

  --ok:#3ddc84; --ok-bg:rgba(61,220,132,.12);
  --warn:#f0b357; --warn-bg:rgba(240,179,87,.12);
  --bad:#ff6b6b; --bad-bg:rgba(255,107,107,.12);

  --sidebar-bg: linear-gradient(180deg, #060b12, #0d1928 88%);
  --sidebar-ink:#7f93a6; --sidebar-ink-active:#ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); background-image:var(--bg-halo); background-attachment:fixed;
  color:var(--ink); font-family:'Instrument Sans', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing:antialiased; font-size:13px;
  transition:background-color .2s ease, color .2s ease;
}
h1,h2,h3,.disp{font-family:'Space Grotesk', sans-serif;}
.mono{font-family:'JetBrains Mono', monospace;}
a{color:inherit;}
button{font-family:inherit;}

/* ============================================================
   # 01 SHELL — grid sidebar + main
   ============================================================ */
.shell{display:grid; grid-template-columns:224px 1fr; min-height:100vh; transition:grid-template-columns .2s ease;}
.shell.collapsed{grid-template-columns:0px 1fr;}
.shell.collapsed .sidebar{padding-left:0; padding-right:0; overflow:hidden;}
.sb-notch{display:none; position:fixed; left:0; top:26px; width:20px; height:58px; background:var(--navy); border:1px solid var(--navy2); border-left:none; border-radius:0 10px 10px 0; align-items:center; justify-content:center; cursor:pointer; z-index:90; color:#9db4c4; box-shadow:2px 0 8px rgba(0,0,0,.15);}
.sb-notch:hover{background:var(--navy2); color:#fff;}
.sb-notch svg{width:11px;height:11px;}
.shell.collapsed .sb-notch{display:flex;}

/* ---- sidebar ---- */
.sidebar{
  background:var(--sidebar-bg); position:sticky; top:0; height:100vh; overflow-y:auto;
  display:flex; flex-direction:column; padding:16px 12px 16px; gap:4px;
}
.sb-top{display:flex; align-items:center; gap:10px; padding:4px 6px 18px; justify-content:space-between;}
.sb-brand{display:flex; align-items:center; gap:10px; overflow:hidden;}
.sb-mark{width:34px;height:34px;min-width:34px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--amber));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--navy-deep);}
.sb-brand h1{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;}
.sb-brand p{font-size:9px;color:#7f9aab;font-family:'JetBrains Mono',monospace;margin-top:1px;white-space:nowrap;}
.shell.collapsed .sb-brand h1, .shell.collapsed .sb-brand p, .shell.collapsed .sb-group-label, .shell.collapsed .sb-label, .shell.collapsed .sb-metric{display:none;}
.sb-toggle{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); color:#9db4c4; width:26px;height:26px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
.sb-toggle:hover{background:rgba(255,255,255,.12); color:#fff;}

.sb-group-label{font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.12em; color:#4f6376; text-transform:uppercase; padding:14px 10px 6px;}
.sb-item{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--sidebar-ink); text-decoration:none; white-space:nowrap; overflow:hidden;}
.sb-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.sb-item.active{background:rgba(255,255,255,.1); color:var(--sidebar-ink-active); box-shadow:inset 3px 0 0 var(--blue);}
.sb-ix{font-family:'JetBrains Mono',monospace; font-size:9px; opacity:.6; min-width:15px;}
.sb-icn{width:16px;height:16px;flex:none; display:flex;align-items:center;justify-content:center;}
.sb-icn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;}
.sb-label{font-size:12.5px; font-weight:500; flex:1;}
.sb-new{font-size:8px; font-weight:700; font-family:'JetBrains Mono',monospace; background:var(--amber); color:#3a2a06; padding:2px 5px; border-radius:5px; letter-spacing:.04em;}
.shell.collapsed .sb-new{display:none;}
.sb-div{height:1px; background:rgba(255,255,255,.08); margin:10px 4px;}
.sb-foot{margin-top:auto; padding-top:14px;}
.sb-role{display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:8px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06);}
.sb-role .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 6px var(--ok);}
.sb-role-txt{overflow:hidden;}
.sb-role-txt b{display:block; font-size:11.5px; color:#fff; white-space:nowrap;}
.sb-role-txt span{font-size:9.5px; color:#7f93a6; font-family:'JetBrains Mono',monospace;}

/* ---- main / topbar ---- */
.main-col{min-width:0;}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line);
  padding:14px 26px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.crumb{display:flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em;}
.crumb .sep{opacity:.5;}
.crumb .cur{color:var(--ink); font-weight:600;}
.crumb-title{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700; margin-top:2px;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.theme-toggle{
  display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px;
  background:var(--surface-soft); border:1px solid var(--line); cursor:pointer; color:var(--ink);
  font-size:11.5px; font-weight:600;
}
.theme-toggle:hover{border-color:var(--blue);}
.theme-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.status-chip{display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; background:var(--ok-bg); border:1px solid rgba(46,139,87,.25); font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ok); font-weight:600;}
.status-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);}

main{padding:22px 26px 60px;}
.panel{display:none; animation:fi .25s ease;}
.panel.active{display:block;}
@keyframes fi{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

/* ============================================================
   # 02 COMPONENTES COMPARTIDOS — KPI cards, tablas, pills, bars
   ============================================================ */
.kg{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px;}
.kc{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; position:relative; overflow:hidden; box-shadow:var(--shadow);}
.kc::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--acc, var(--blue));}
.kl{font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:600;}
.kv{font-family:'Space Grotesk',sans-serif; font-size:25px; font-weight:700; margin-top:4px; line-height:1;}
.kv .u{font-size:11.5px; color:var(--ink-faint); font-weight:500; margin-left:3px;}
.kf{font-size:10px; color:var(--ink-soft); margin-top:7px; display:flex; align-items:center; gap:5px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow);}
.ct{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:13.5px; display:flex; align-items:center; justify-content:space-between; margin-bottom:13px; flex-wrap:wrap; gap:8px;}
.ct .sub{font-size:10px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; font-weight:400;}
.g2{display:grid; grid-template-columns:1.4fr 1fr; gap:14px; align-items:start;}
.g2 > *{min-width:0;}
.g3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:1080px){.g2,.g3{grid-template-columns:1fr;}}

.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:600;}
.pill.ok{background:var(--ok-bg); color:var(--ok);}
.pill.warn{background:var(--warn-bg); color:var(--warn);}
.pill.bad{background:var(--bad-bg); color:var(--bad);}
.pill.neu{background:var(--surface-soft); color:var(--ink-soft); border:1px solid var(--line);}

table.std{width:100%; border-collapse:collapse;}
table.std th{text-align:left; padding:8px 10px; font-size:9.8px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); border-bottom:2px solid var(--line); font-weight:600; white-space:nowrap; background:var(--surface); position:sticky; top:0;}
table.std td{padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; font-size:12px;}
table.std td.mono{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft);}
table.std tbody tr:hover{background:var(--surface-soft);}
.tbl-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--line);}
.tbl-scroll{max-height:420px; overflow-y:auto; border-radius:10px; border:1px solid var(--line);}

.bars{display:flex; flex-direction:column; gap:9px;}
.br{display:grid; grid-template-columns:110px 1fr 46px; align-items:center; gap:10px;}
.bl{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bt{height:8px; border-radius:4px; background:var(--surface-soft); overflow:hidden; border:1px solid var(--line);}
.bf{height:100%; border-radius:4px; background:linear-gradient(90deg,var(--blue),var(--navy2));}
.bv{font-family:'JetBrains Mono',monospace; font-size:11px; text-align:right; color:var(--ink);}

.empty-state{padding:36px 20px; text-align:center; color:var(--ink-faint); font-size:12.5px;}
.empty-state svg{width:34px;height:34px; stroke:var(--ink-faint); fill:none; stroke-width:1.5; margin-bottom:10px;}

.mock-tag{display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--amber); background:var(--warn-bg); border:1px solid rgba(232,163,61,.35); padding:3px 8px; border-radius:6px; margin-bottom:14px;}

/* ---- Forecast: filtros + curva SVG con hover ---- */
.fc-tooltip{position:fixed; z-index:60; background:var(--navy); color:#fff; padding:10px 14px; border-radius:9px; font-size:11.5px; line-height:1.5; pointer-events:none; opacity:0; transition:opacity .12s ease; box-shadow:0 8px 24px rgba(0,0,0,.32); max-width:230px;}
.fc-tt-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12.5px; margin-bottom:7px; padding-bottom:6px; border-bottom:1px solid rgba(255,255,255,.15);}
.fc-tt-row{display:flex; align-items:center; gap:7px; padding:2.5px 0;}
.fc-tt-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.fc-tt-lbl{flex:1;opacity:.85;}
.fc-tt-val{font-family:'JetBrains Mono',monospace;font-weight:700;}
.fc-tt-sep{height:1px;background:rgba(255,255,255,.12);margin:6px 0;}
.fc-badge{position:absolute; transform:translate(-50%,-100%); background:var(--ok-bg); color:var(--ok); font-family:'JetBrains Mono',monospace; font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:5px; white-space:nowrap; pointer-events:none;}
.fc-metric-btn{font-size:11px; font-weight:700; padding:6px 13px; border-radius:7px; border:1px solid var(--line); background:var(--surface-soft); color:var(--ink-soft); cursor:pointer;}
.fc-metric-btn.active{background:var(--blue); color:#fff; border-color:var(--blue);}
.fc-label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600; margin-bottom:7px;}
.fc-chip-group{display:flex; flex-wrap:wrap; gap:6px; max-width:460px;}
.fc-chip{display:flex; align-items:center; gap:5px; font-size:11px; padding:4px 9px; border-radius:6px; background:var(--surface-soft); border:1px solid var(--line); cursor:pointer; user-select:none;}
.fc-chip input{cursor:pointer;}
.fc-mini-link{font-size:10px; color:var(--blue); cursor:pointer; text-decoration:none;}
.fc-mini-link:hover{text-decoration:underline;}

/* ---- Ports: cards, donut, proyección por semana ---- */
.port-card{border:1px solid var(--line); border-radius:12px; padding:14px 16px; background:var(--surface); border-left:4px solid var(--pc,var(--blue));}
.port-card .pcn{display:flex; justify-content:space-between; align-items:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; margin-bottom:8px;}
.port-card .pcs{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px;}
.port-card .pcm{display:flex; height:8px; border-radius:4px; overflow:hidden; margin-top:8px;}
.port-card .pc-footer{display:flex; justify-content:space-around; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
.port-card .pc-stat{text-align:center;}
.port-card .pc-stat-val{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:20px;}
.port-card .pc-stat-lbl{font-size:9.5px; color:var(--ink-faint); text-transform:uppercase;}
.donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
.donut-ring{width:120px; height:120px; border-radius:50%; flex-shrink:0; position:relative;}
.donut-ring::after{content:''; position:absolute; inset:16px; background:var(--surface); border-radius:50%;}
.donut-center{position:absolute; inset:16px; display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:1;}
.donut-legend{display:flex; flex-direction:column; gap:8px;}
.donut-legend .dli{display:flex; align-items:center; gap:8px; font-size:12px;}
.donut-legend .dls{width:9px; height:9px; border-radius:2px; flex-shrink:0;}
.donut-legend .dlv{margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-soft);}
.sc-chart{display:flex; align-items:flex-end; gap:6px; overflow-x:auto; padding-bottom:4px;}
.sc-col{display:flex; flex-direction:column; align-items:center; gap:6px; min-width:34px; height:100%; justify-content:flex-end; cursor:pointer;}
.sc-col .sc-bars{width:100%; display:flex; flex-direction:column-reverse; border-radius:4px 4px 2px 2px; overflow:hidden; min-height:2px;}
.sc-col .seg{width:100%;}
.sc-col .sc-val{font-family:'JetBrains Mono',monospace; font-size:9.5px; color:var(--ink-soft);}
.sc-col .sc-lbl{font-family:'JetBrains Mono',monospace; font-size:9px; color:var(--ink-faint);}
.ports-badge{display:block; text-align:center; margin-top:8px; font-size:10px; font-weight:600; padding:5px 8px; border-radius:6px;}

/* ---- PMI: KPI zone, mode badges, rings, tablas pivote ---- */
.pmi-kpi-zone{display:flex; gap:26px; flex-wrap:wrap; margin-top:4px;}
.pmi-kpi-col{display:flex; flex-direction:column; gap:8px;}
.pmi-kpi-h{font-size:10px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.pmi-kpi-h-sub{font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink-faint);}
.pmi-mode-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface-soft); border:1px solid var(--line); border-radius:8px; padding:8px 12px; border-left:4px solid var(--mc); margin-bottom:6px;}
.pmi-mode-lbl{display:flex; align-items:center; gap:7px; font-weight:700; font-size:12.5px;}
.pmi-mode-val{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; display:flex; align-items:baseline; gap:5px;}
.pmi-mode-sub{font-weight:500; font-size:10px; color:var(--ink-soft);}
.pmi-basc-row{display:grid; grid-template-columns:130px 1fr 50px; align-items:center; gap:8px; margin-bottom:6px;}
.pmi-basc-lbl{font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pmi-basc-bar-wrap{height:8px; border-radius:4px; background:var(--surface-soft); border:1px solid var(--line); overflow:hidden;}
.pmi-basc-bar{height:100%; background:linear-gradient(90deg,var(--blue),var(--navy2)); border-radius:4px;}
.pmi-basc-val{font-family:'JetBrains Mono',monospace; font-size:11px; text-align:right;}
.pmi-ring-card{display:flex; align-items:center; gap:10px; background:var(--surface-soft); border:1px solid var(--line); border-radius:10px; padding:10px 14px; flex:1;}
.pmi-ring-t{font-size:10px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
.pmi-ring-v{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px;}
.pmi-ring-u{font-weight:500; font-size:10.5px; color:var(--ink-faint);}
.mode-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:6px;}
.mode-badge.mA{background:rgba(46,143,176,.12); color:var(--blue);}
.mode-badge.mM{background:rgba(22,59,84,.12); color:var(--navy2);}
.mode-badge.mT{background:rgba(122,111,208,.12); color:var(--purple);}
.att-pa{background:var(--surface-soft); color:var(--ink-soft); border:1px solid var(--line); font-size:9.5px; font-weight:600; padding:2px 7px; border-radius:5px;}
.att-sn{background:var(--ok-bg); color:var(--ok); font-size:9.5px; font-weight:600; padding:2px 7px; border-radius:5px;}
table.pivot{width:100%; border-collapse:collapse; font-size:11px;}
table.pivot.pivot-fixed{table-layout:fixed;}
table.pivot th{text-align:left; padding:7px 9px; font-size:9.5px; text-transform:uppercase; color:var(--ink-soft); border-bottom:2px solid var(--line); font-weight:600; white-space:nowrap; background:var(--surface); position:sticky; top:0;}
table.pivot td{padding:6px 9px; border-bottom:1px solid var(--line); white-space:nowrap;}
table.pivot .tv{font-family:'JetBrains Mono',monospace; text-align:center; color:var(--ink);}
table.pivot .tz{font-family:'JetBrains Mono',monospace; text-align:center; color:var(--ink-faint);}
table.pivot .tot-v{font-family:'JetBrains Mono',monospace; text-align:right; font-weight:700;}
table.pivot tr.date-total td, table.pivot tr.pk-total td{background:var(--surface-soft); font-weight:600;}
table.pivot tr.grand-total td{background:var(--navy); color:#fff; font-weight:700;}
.pivot-scroll{max-height:520px; overflow:auto; border-radius:8px; border:1px solid var(--line);}

/* ---- Air Program: modal de detalle, donut, tabla dinámica ---- */
.detail-overlay{position:fixed; inset:0; background:rgba(10,18,26,.55); z-index:150; display:none; align-items:center; justify-content:center; padding:20px;}
.instr-tabs{display:flex; flex-wrap:wrap; gap:6px; padding:12px 18px 0; border-bottom:1px solid var(--line);}

/* ---- Incidencias: sub-pestañas internas, badges de criticidad ---- */

/* ---- Transporte: banner de calidad de datos, barras de progreso ---- */

<div class="shell" id="shell">

  <!-- ============================================================

  <nav class="sidebar" id="sidebar">

<script>
/* ============================================================
   # 05 CONFIG DE NAVEGACIÓN — fuente única de verdad para sidebar + routing
   ============================================================ */
const NAV = [
  {group:'export', label:'Export (ARES)', items:[
    {id:'forecast', ix:'01', label:'Forecast'},
    {id:'ports',    ix:'02', label:'Ports'},
    {id:'wep',      ix:'03b',label:'Weekly Export Program'},
    {id:'pmi',      ix:'04', label:'PMI'},
    {id:'air',      ix:'05', label:'Air Program'},
    {id:'execute',  ix:'06', label:'Execute'},
  ]},
  {group:'transporte', label:'Transporte', items:[
    {id:'retiro',   ix:'07', label:'Pickup'},
    {id:'packing',  ix:'08', label:'Packing'},
    {id:'ingreso',  ix:'09', label:'Receiving'},
  ]},
  {group:'calidad', label:'Calidad', items:[
    {id:'incidencias', ix:'11', label:'Incidencias'},
  ]},
  {group:'sistema', label:'Sistema', items:[
    {id:'upload',   ix:'10', label:'Actualizar Datos'},
  ]},
];
const MODULE_OF = {}; NAV.forEach(g=>g.items.forEach(it=>MODULE_OF[it.id]=g.label));
let currentView = 'forecast';

function renderSidebar(){
  const c = document.getElementById('navContainer');
  c.innerHTML = NAV.map(g => `
    <div class="sb-group-label">${g.label}</div>
    ${g.items.map(it => `
      <a class="sb-item" data-view="${it.id}" onclick="goTo('${it.id}')">
        <span class="sb-ix">${it.ix}</span>
        <span class="sb-label">${it.label}</span>
        ${it.tag ? `<span class="sb-new">${it.tag}</span>` : ''}
      </a>`).join('')}
  `).join('<div class="sb-div"></div>');
}

// Reproduce, para cualquier vista, el mismo "llenado gradual" que ya tenían
// las 3 vistas de Transporte (que reconstruyen sus Chart.js al hacer visible
// el panel). El resto de gráficos del dashboard NO son Chart.js — son barras
// y SVG dibujados a mano con % en el propio style — así que en vez de un
// motor de animación, se les pone su ancho/alto final en 0, se fuerza un
// reflow, y se les regresa a su valor real con una transición CSS.
function animateBarsIn(root){
  if(!root) return;
  root.querySelectorAll('.bf, .sc-bars, .seg').forEach(el=>{
    const isWidth = el.style.width !== '';
    const isHeight = el.style.height !== '';
    if (!isWidth && !isHeight) return;
    const target = isWidth ? el.style.width : el.style.height;
    el.style.transition = 'none';
    if (isWidth) el.style.width = '0%'; else el.style.height = '0%';
    void el.offsetWidth; // fuerza reflow para que el navegador registre el 0% antes de animar
    requestAnimationFrame(()=>{
      el.style.transition = (isWidth ? 'width' : 'height') + ' .7s cubic-bezier(.22,1,.36,1)';
      if (isWidth) el.style.width = target; else el.style.height = target;
    });
  });
  root.querySelectorAll('.donut-ring').forEach(el=>{
    const bg = el.style.background;
    el.style.transition = 'none';
    el.style.background = 'none';
    void el.offsetWidth;
    requestAnimationFrame(()=>{
      el.style.transition = 'background .8s ease';
      el.style.background = bg;
    });
  });
}

function goTo(id){
  currentView = id;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('active', el.dataset.view===id));
  document.querySelectorAll('.panel').forEach(el=>el.classList.toggle('active', el.id==='p-'+id));
  const item = NAV.flatMap(g=>g.items).find(i=>i.id===id);
  document.getElementById('crumbModule').textContent = MODULE_OF[id].toUpperCase();
  document.getElementById('crumbView').textContent = item.label;
  document.getElementById('crumbTitle').textContent = item.label;
  // Los canvas de Chart.js quedan con tamaño 0x0 si se instancian mientras
  // su panel tiene display:none (buildPanels() los crea todos de una vez).
  // Al navegar a una vista de Transporte, se reconstruyen ya con el panel
  // visible para que tomen el tamaño real. requestAnimationFrame asegura que
  // el navegador ya aplicó el display:block antes de medir el canvas.
  if (typeof CHART_VIEWS !== 'undefined' && CHART_VIEWS[id]) {
    requestAnimationFrame(() => {
      CHART_VIEWS[id].forEach(chId => {
        const b = window['build_'+chId];
        if (b) { try { b(); } catch(e) { console.error('Error construyendo chart', chId, e); } }
        else { console.warn('No existe build_'+chId+' — ¿renderRetiro/Packing/Ingreso corrió antes?'); }
      });
    });
  }
  // Mismo motivo que el bloque de arriba (panel oculto al construir el
  // contenido) aplicado a las barras/SVG a mano del resto de vistas: se
  // animan recién cuando el panel ya es visible.
  requestAnimationFrame(() => animateBarsIn(document.getElementById('p-'+id)));

/* ============================================================
   # 05b MSD — Multi-Select Dropdown (checklist), componente
   reutilizable para todos los filtros de la app (reemplaza los
   chips inline sueltos por un dropdown "All X ▾" con checklist,
   igual al patrón de control_tower_transporte__4_.html).
   ============================================================ */
function msdField(id, allLabel, opts, refreshFnName, labelFn){
  const cbClass = id + '-cb';
  const items = opts.map(o => {
    const val = String(o).replace(/"/g,'&quot;');
    const lbl = labelFn ? labelFn(o) : o;
    return `<label class="msd-item"><input type="checkbox" class="${cbClass}" value="${val}" checked onchange="msdOnItemChange('${id}','${allLabel.replace(/'/g,"\\'")}');${refreshFnName}();">${lbl}</label>`;
  }).join('');
  return `
  <div class="msd" id="${id}" data-refresh-fn="${refreshFnName}" data-all-label="${allLabel.replace(/"/g,'&quot;')}">
    <button type="button" class="msd-btn" onclick="msdToggle('${id}')">
      <span id="${id}-label">${allLabel}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="msd-panel" id="${id}-panel">
      <label class="msd-item msd-item-all"><input type="checkbox" checked onchange="msdToggleAll('${id}', this.checked, '${allLabel.replace(/'/g,"\\'")}');${refreshFnName}();">${allLabel}</label>
      <div class="msd-sep"></div>
      ${items || '<div class="empty-state" style="padding:14px;">Sin opciones</div>'}
    </div>
  </div>`;
}
// Recalcula solo las OPCIONES visibles de un filtro multi-select ya montado
// (sin recrear el botón/dropdown, para no perder el estado abierto/cerrado),
// preservando la selección previa cuando sigue siendo válida. Se usa para
// que los filtros se comporten en cascada: las opciones de un filtro
// reflejan el subconjunto de datos que dejan los DEMÁS filtros activos.
function msdRebuild(id, opts, labelFn){
  const container = document.getElementById(id);
  const panel = document.getElementById(id+'-panel');
  if (!container || !panel) return;
  const refreshFnName = container.dataset.refreshFn;
  const allLabel = container.dataset.allLabel;
  const prevChecked = new Set(msdChecked(id));
  const prevAll = msdAllValues(id);
  const cbClass = id + '-cb';
  const optVals = opts.map(o=>String(o));
  // Un checkbox recién creado por msdField() siempre nace con TODO marcado,
  // así que prevChecked.size===prevAll.length es el único estado "intacto,
  // sin tocar" — ahí sí seguimos el universo nuevo tal cual (todo marcado).
  // Si el usuario ya vació el filtro a propósito (0 marcados, para luego ir
  // marcando de a uno) hay que RESPETAR ese vacío en vez de re-marcar todo
  // — si no, destildar "All" nunca "se sostiene" y no se puede elegir uno solo.
  const wasFull = prevAll.length > 0 && prevChecked.size === prevAll.length;
  let checkedSet;
  if (wasFull) {
    checkedSet = new Set(optVals);
  } else if (prevChecked.size === 0) {
    checkedSet = new Set();
  } else {
    const kept = optVals.filter(v=>prevChecked.has(v));
    // Si la cascada hizo desaparecer TODAS las opciones que tenía marcadas
    // (ninguna sobrevive en el nuevo universo), no queda selección válida
    // que preservar — volvemos a "todo marcado" en vez de dejarlo vacío.
    checkedSet = kept.length ? new Set(kept) : new Set(optVals);
  }
  const items = opts.map((o,i) => {
    const raw = optVals[i];
    const val = raw.replace(/"/g,'&quot;');
    const lbl = labelFn ? labelFn(o) : o;
    const checked = checkedSet.has(raw);
    return `<label class="msd-item${checked?' checked':''}"><input type="checkbox" class="${cbClass}" value="${val}" ${checked?'checked':''} onchange="msdOnItemChange('${id}','${allLabel.replace(/'/g,"\\'")}');${refreshFnName}();">${lbl}</label>`;
  }).join('');
  const allChecked = optVals.length > 0 && optVals.every(v=>checkedSet.has(v));
  panel.innerHTML = `<label class="msd-item msd-item-all"><input type="checkbox" ${allChecked?'checked':''} onchange="msdToggleAll('${id}', this.checked, '${allLabel.replace(/'/g,"\\'")}');${refreshFnName}();">${allLabel}</label>
    <div class="msd-sep"></div>
    ${items || '<div class="empty-state" style="padding:14px;">Sin opciones</div>'}`;
  msdUpdateLabel(id, allLabel);
}
function msdToggle(id){
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.msd.open').forEach(m=>m.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}
document.addEventListener('click', (e)=>{
  if (!e.target.closest('.msd')) document.querySelectorAll('.msd.open').forEach(m=>m.classList.remove('open'));
});
function msdChecked(id){ return [...document.querySelectorAll('#'+id+' .'+id+'-cb:checked')].map(cb=>cb.value); }
function msdAllValues(id){ return [...document.querySelectorAll('#'+id+' .'+id+'-cb')].map(cb=>cb.value); }
function msdToggleAll(id, state){
  document.querySelectorAll('#'+id+' .'+id+'-cb').forEach(cb=>{ cb.checked = state; cb.closest('.msd-item').classList.toggle('checked', state); });
  msdUpdateLabel(id);
}
// Deja marcada SOLO la opción con este valor (si existe entre las opciones
// disponibles); devuelve true si la encontró, false si no (para poder avisar
// al usuario, ej. "hoy no tiene despachos registrados").
function msdSelectOnly(id, value){
  const cbs = [...document.querySelectorAll('#'+id+' .'+id+'-cb')];
  const target = cbs.find(cb=>cb.value===value);
  if (!target) return false;
  cbs.forEach(cb=>{ cb.checked = (cb===target); cb.closest('.msd-item').classList.toggle('checked', cb===target); });
  const allCb = document.querySelector('#'+id+' .msd-item-all input');
  if (allCb) allCb.checked = false;
  msdUpdateLabel(id);
  return true;
}
function msdOnItemChange(id, allLabel){
  const all = msdAllValues(id), sel = msdChecked(id);
  const allCb = document.querySelector('#'+id+' .msd-item-all input');
  if (allCb) allCb.checked = sel.length === all.length;
  document.querySelectorAll('#'+id+' .'+id+'-cb').forEach(cb=>cb.closest('.msd-item').classList.toggle('checked', cb.checked));
  msdUpdateLabel(id, allLabel);
}
function msdUpdateLabel(id, allLabel){
  const labelEl = document.getElementById(id+'-label');
  if (!labelEl) return;
  allLabel = allLabel || labelEl.dataset.allLabel || labelEl.textContent;
  labelEl.dataset.allLabel = allLabel;
  const all = msdAllValues(id), sel = msdChecked(id);
  if (sel.length === 0 || sel.length === all.length) labelEl.textContent = allLabel;
  else if (sel.length === 1) labelEl.textContent = sel[0];
  else labelEl.textContent = sel.length + ' sel.';
}
// Devuelve la selección real para filtrar: array vacío o "todos" => sin filtro (undefined)
function msdFilterValues(id){
  const all = msdAllValues(id), sel = msdChecked(id);
  if (sel.length === 0 || sel.length === all.length) return null; // sin filtro
  return sel;
}

const calcPct = (num, den) => den ? +(100*num/den).toFixed(1) : 0;
const sum = arr => arr.reduce((a,b)=>a+b,0);
const badge = v => v>=90 ? 'ok' : v>=75 ? 'warn' : 'bad';
const fmt1 = v => (Math.round(v*10)/10).toLocaleString('es-PE',{minimumFractionDigits:1,maximumFractionDigits:1});
// new Date("2026-07-30") se interpreta como medianoche UTC — en un huso horario
// detrás de UTC (Perú, UTC-5) esto corre la fecha un día hacia atrás al
// mostrarla en hora local. Este helper parsea "YYYY-MM-DD" como fecha LOCAL,
// evitando el corrimiento. Úsalo en vez de `new Date(dateStr)` para cualquier
// fecha de carga que venga como string plano de WROWS.
function parseLocalDate(dateStr){
  if (!dateStr) return null;
  const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const dt = new Date(dateStr);
  return isNaN(dt) ? null : dt;
}
// Compara fechas en formato "DD/MM/YYYY" (dispatch_date/dispatch) cronológicamente
// — un .sort() plano las ordena como texto (alfabético), no por fecha real.
function cmpDDMMYYYY(a, b){
  const [da,ma,ya] = String(a).split('/').map(Number);
  const [db,mb,yb] = String(b).split('/').map(Number);
  return (ya-yb) || (ma-mb) || (da-db);
}
// Hoy, en el mismo formato "DD/MM/YYYY" que usan dispatch_date/dispatch.
function todayDDMMYYYY(){
  const t = new Date();
  return String(t.getDate()).padStart(2,'0')+'/'+String(t.getMonth()+1).padStart(2,'0')+'/'+t.getFullYear();
}

function fcAggregate(rows, weeks){
  const byWeek = {};
  weeks.forEach(wk=>{ byWeek[wk] = {wk, label:'S'+wk, fcl_conf:0,pal_conf:0, fcl_proj:0,pal_proj:0, fcl_add:0,pal_add:0, fcl_expo:0,pal_expo:0, fcl_exadd:0,pal_exadd:0, fcl_airadd:0,pal_airadd:0, fcl_cancelado:0,pal_cancelado:0, fcl_pre_conf:0,pal_pre_conf:0, fcl_add_conf:0,pal_add_conf:0, fcl_exadd_conf:0,pal_exadd_conf:0 }; });
  rows.forEach(r=>{
    const b = byWeek[r.pack_plan]; if(!b) return;
    const fcl = r.fcl||0, pal = r.pallets||0;
    const isProj = r.is_pre;
    const isConf = r.status==='Confirmado';
    if(isConf){ b.fcl_conf+=fcl; b.pal_conf+=pal; }
    if(r.status==='Cancelado'){ b.fcl_cancelado+=fcl; b.pal_cancelado+=pal; }
    if(isProj){ b.fcl_proj+=fcl; b.pal_proj+=pal; }
    if(r.is_add){ b.fcl_add+=fcl; b.pal_add+=pal; }
    if(r.is_expo){ b.fcl_expo+=fcl; b.pal_expo+=pal; }
    if(r.is_exadd){ b.fcl_exadd+=fcl; b.pal_exadd+=pal; }
    if(r.is_airadd){ b.fcl_airadd+=fcl; b.pal_airadd+=pal; }
    // Desglose de Confirmado por origen del tag (para el tooltip de la curva):
    // PRE que se confirmó + ADD que se confirmó + EXPOADD que se confirmó = Confirmado total
    if(isConf && isProj){ b.fcl_pre_conf+=fcl; b.pal_pre_conf+=pal; }
    if(isConf && r.is_add){ b.fcl_add_conf+=fcl; b.pal_add_conf+=pal; }
    if(isConf && r.is_exadd){ b.fcl_exadd_conf+=fcl; b.pal_exadd_conf+=pal; }
  });
  return weeks.map(wk=>{
    const b = byWeek[wk];
    b.fcl_addon = b.fcl_add + b.fcl_exadd;
    b.pal_addon = b.pal_add + b.pal_exadd;
    b.fcl_addon_conf = b.fcl_add_conf + b.fcl_exadd_conf;
    b.pal_addon_conf = b.pal_add_conf + b.pal_exadd_conf;
    return b;
  });
}

  </div>

function refreshForecast(){
  const rows = FORECAST_RAW || [];
  if(!document.getElementById('fc-kg')) return; // panel de Forecast no está en el DOM todavía
  const selShippers = msdFilterValues('msd-fc-shipper') || [];
  const selModes = msdFilterValues('msd-fc-mode') || [];
  const selPods = msdFilterValues('msd-fc-pod') || [];
  const selLines = msdFilterValues('msd-fc-line') || [];
  const selTops = msdFilterValues('msd-fc-top') || [];
  const selMarkets = msdFilterValues('msd-fc-market') || [];
  const selWeeks = fcChecked('fc-cb-week').map(Number);

  let ft = rows;
  if(selShippers.length) ft = ft.filter(r=>selShippers.includes(r.shipper));
  if(selModes.length) ft = ft.filter(r=>selModes.includes(r.mode));
  if(selPods.length) ft = ft.filter(r=>selPods.includes(r.pod));
  if(selLines.length) ft = ft.filter(r=>selLines.includes(r.line));
  if(selTops.length) ft = ft.filter(r=>selTops.includes(r.transport_operator));
  if(selMarkets.length) ft = ft.filter(r=>selMarkets.includes(r.market));
  const ftBeforeWeekFilter = ft; // para "Proyección 6W": siempre las últimas 6 semanas reales, sin importar qué esté tildado en el checklist de Pack Plan
  if(selWeeks.length) ft = ft.filter(r=>selWeeks.includes(r.pack_plan));
  fcDetailRows = ft; // exactamente las filas que componen la Curva global de abajo

  // Filtros en cascada: las opciones de CADA filtro reflejan el subconjunto de
  // datos que dejan los DEMÁS filtros activos (no el propio) — así, si se
  // filtra Modo=Aéreo, Destinos solo lista destinos que existen en registros
  // aéreos.
  const modeOrderFc = ['Marítimo','Aéreo','Terrestre'];
  const fcCascadeExcl = (exclude) => {
    let r = rows;
    if (exclude!=='shipper' && selShippers.length) r = r.filter(x=>selShippers.includes(x.shipper));
    if (exclude!=='mode' && selModes.length) r = r.filter(x=>selModes.includes(x.mode));
    if (exclude!=='pod' && selPods.length) r = r.filter(x=>selPods.includes(x.pod));
    if (exclude!=='line' && selLines.length) r = r.filter(x=>selLines.includes(x.line));
    if (exclude!=='top' && selTops.length) r = r.filter(x=>selTops.includes(x.transport_operator));
    if (exclude!=='market' && selMarkets.length) r = r.filter(x=>selMarkets.includes(x.market));
    return r;
  };
  msdRebuild('msd-fc-shipper', [...new Set(fcCascadeExcl('shipper').map(r=>r.shipper).filter(Boolean))].sort());
  msdRebuild('msd-fc-mode', [...new Set(fcCascadeExcl('mode').map(r=>r.mode).filter(Boolean))].sort((a,b)=>modeOrderFc.indexOf(a)-modeOrderFc.indexOf(b)), m=>(m==='Aéreo'?'✈ ':m==='Marítimo'?'⚓ ':'🚚 ')+m);
  msdRebuild('msd-fc-pod', [...new Set(fcCascadeExcl('pod').map(r=>r.pod).filter(Boolean))].sort());
  msdRebuild('msd-fc-line', [...new Set(fcCascadeExcl('line').map(r=>r.line).filter(Boolean))].sort());
  msdRebuild('msd-fc-top', [...new Set(fcCascadeExcl('top').map(r=>r.transport_operator).filter(Boolean))].sort());
  msdRebuild('msd-fc-market', [...new Set(fcCascadeExcl('market').map(r=>r.market).filter(Boolean))].sort());

  const allWeeks = [...new Set(rows.map(r=>r.pack_plan))].sort((a,b)=>a-b);
  const weeks = selWeeks.length ? selWeeks.slice().sort((a,b)=>a-b) : allWeeks;

  const wks = fcAggregate(ft, weeks);
  const wAir = fcAggregate(ft.filter(r=>r.mode==='Aéreo'), weeks);
  const wTer = fcAggregate(ft.filter(r=>r.mode==='Terrestre'), weeks);
  const wMar = fcAggregate(ft.filter(r=>r.mode==='Marítimo'), weeks);

  const kC = fcMetric==='fcl'?'fcl_conf':'pal_conf', kP = fcMetric==='fcl'?'fcl_proj':'pal_proj', kA = fcMetric==='fcl'?'fcl_addon':'pal_addon';
  const kAdd = fcMetric==='fcl'?'fcl_add':'pal_add', kExpo = fcMetric==='fcl'?'fcl_expo':'pal_expo', kExadd = fcMetric==='fcl'?'fcl_exadd':'pal_exadd', kAirAdd = fcMetric==='fcl'?'fcl_airadd':'pal_airadd';
  const unit = fcMetric==='fcl' ? 'FCL' : 'Pallets';
  const fmtM = v => fcMetric==='fcl' ? fmt1(v) : Math.round(v).toLocaleString('es-PE');

  const totC = sum(wks.map(w=>w[kC])), totP = sum(wks.map(w=>w[kP])), totA = sum(wks.map(w=>w[kA]));
  const totAdd = sum(wks.map(w=>w[kAdd])), totExpo = sum(wks.map(w=>w[kExpo])), totExadd = sum(wks.map(w=>w[kExadd])), totAirAdd = sum(wks.map(w=>w[kAirAdd]));

  // Proyección 6W: suma de Proyección (PRE) de las últimas 6 semanas (Pack Plan) que
  // existan en el dataset — siempre las últimas 6 reales, sin importar qué esté
  // tildado en el checklist de Pack Plan del filtro.
  const allWeeksSorted = [...new Set(ftBeforeWeekFilter.map(r=>r.pack_plan))].sort((a,b)=>a-b);
  const last6Weeks = allWeeksSorted.slice(-6);
  const wks6 = fcAggregate(ftBeforeWeekFilter, last6Weeks);
  const totP6W = sum(wks6.map(w=>w[kP]));

  document.getElementById('fc-kg').innerHTML = `<div class="kg">
    <div class="kc" style="--acc:var(--blue)"><div class="kl">${unit} Confirmado</div><div class="kv">${fmtM(totC)}<span class="u">${unit}</span></div><div class="kf">${wks.length} semana(s)</div></div>
    <div class="kc" style="--acc:var(--amber)"><div class="kl">AIRADD</div><div class="kv">${fmtM(totAirAdd)}<span class="u">${unit}</span></div><div class="kf">adicionales</div></div>
    <div class="kc" style="--acc:var(--ok)"><div class="kl">ADD</div><div class="kv">${fmtM(totAdd)}<span class="u">${unit}</span></div><div class="kf">adicionales</div></div>
    <div class="kc" style="--acc:var(--purple)"><div class="kl">EXPO</div><div class="kv">${fmtM(totExpo)}<span class="u">${unit}</span></div><div class="kf">adicionales</div></div>
    <div class="kc" style="--acc:var(--warn)"><div class="kl">EXPOADD</div><div class="kv">${fmtM(totExadd)}<span class="u">${unit}</span></div><div class="kf">adicionales</div></div>
    <div class="kc" style="--acc:var(--navy2)"><div class="kl">Proyección 6W</div><div class="kv">${fmtM(totP6W)}<span class="u">${unit}</span></div><div class="kf">últimas ${last6Weeks.length} semana(s): ${last6Weeks.map(w=>'S'+w).join(', ')}</div></div>
  </div>`;

  const rowsHtml = wks.map(w=>{
    const hasC = w[kC] > 0;
    const ej = w[kP] ? pct(w[kC], w[kP]) : 0;
    const cls = hasC ? (ej>=90?'ok':ej>=70?'warn':'bad') : 'neu';
    const dev = hasC ? (w[kC]-w[kP]>=0?'+':'')+fmtM(w[kC]-w[kP]) : '—';
    const backupDenom = w[kExpo] + w[kExadd];
    const backupPct = backupDenom > 0 ? pct(w[kExadd], backupDenom) : null;
    return `<tr><td class="mono">${w.label}</td><td class="mono" style="text-align:right;color:var(--amber);font-weight:600;">${fmtM(w[kP])}</td><td class="mono" style="text-align:right">${w[kA]>0?fmtM(w[kA]):'—'}</td><td class="mono" style="text-align:right;color:var(--blue);font-weight:600;">${hasC?fmtM(w[kC]):'—'}</td><td class="mono" style="text-align:right;color:${hasC && w[kC]<w[kP] ? 'var(--bad)':'var(--ok)'};font-weight:600;">${dev}</td><td><span class="pill ${cls}">${hasC?ej+'%':'Sin ejec.'}</span></td><td class="mono" style="text-align:right">${backupPct!==null?backupPct+'%':'—'}</td></tr>`;
  }).join('');
  document.getElementById('fc-dev-body').innerHTML = rowsHtml || `<tr><td colspan="7" class="empty-state">Selecciona al menos un Pack Plan</td></tr>`;
  document.getElementById('fc-stat').textContent = `${wks.length} de ${allWeeks.length} semanas · métrica: ${unit}`;

  if (wks.length > 1) {
    renderForecastCurve('fc-chart-wrap', wks, fcMetric);
    renderForecastCurve('fc-wrap-air', wAir, fcMetric);
    renderForecastCurve('fc-wrap-ter', wTer, fcMetric);
    renderForecastCurve('fc-wrap-mar', wMar, fcMetric);
  } else {
    ['fc-chart-wrap','fc-wrap-air','fc-wrap-ter','fc-wrap-mar'].forEach(id=>{
      document.getElementById(id).innerHTML = '<div class="empty-state">Selecciona 2+ semanas para trazar la curva</div>';
    });
  }
}

function renderForecastCurve(wrapId, weeksData, metric){
  const el = document.getElementById(wrapId);
  if(!el) return;
  if(!weeksData.length || weeksData.length < 2){
    el.innerHTML = '<div class="empty-state">Selecciona 2+ semanas para trazar la curva</div>';
    return;
  }
  const kC = metric==='fcl'?'fcl_conf':'pal_conf', kP = metric==='fcl'?'fcl_proj':'pal_proj';
  const kCanc = metric==='fcl'?'fcl_cancelado':'pal_cancelado';
  const kA = metric==='fcl'?'fcl_addon':'pal_addon';
  const fmtM = v => metric==='fcl' ? fmt1(v) : Math.round(v).toLocaleString('es-PE');
  const W=900, H=300, pL=38, pB=26, pT=12;
  const mx = Math.max(...weeksData.map(w=>Math.max(w[kC], w[kP])), 1);
  const xOf = i => pL + i*(W-pL-14)/(weeksData.length-1);
  const yOf = v => H-pB-(v/mx)*(H-pT-pB);
  const grid = [0,.25,.5,.75,1].map(f=>{
    const y = pT+(1-f)*(H-pT-pB);
    return `<line x1="${pL}" y1="${y.toFixed(0)}" x2="${W-4}" y2="${y.toFixed(0)}" stroke="var(--line)" stroke-width="1"/><text x="${pL-6}" y="${(y+3).toFixed(0)}" text-anchor="end" font-size="9" fill="var(--ink-faint)" font-family="JetBrains Mono">${fmtM(mx*f)}</text>`;
  }).join('');
  const xlbls = weeksData.map((w,i)=>`<text x="${xOf(i).toFixed(0)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--ink-soft)" font-family="JetBrains Mono">${w.label}</text>`).join('');
  // Proyección (línea naranja) = solo FCL/Pallets con clasificación PRE — ya no suma Adicionales.
  const projPts = weeksData.map((w,i)=>({x:xOf(i), y:yOf(w[kP])}));
  const pathOf = pts => pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaOf = pts => `${pathOf(pts)} L${pts[pts.length-1].x.toFixed(1)},${(H-pB).toFixed(1)} L${pts[0].x.toFixed(1)},${(H-pB).toFixed(1)} Z`;

  // Confirmado: no se dibuja (ni se aplana en 0) para semanas sin dato confirmado
  // todavía (ej. semanas futuras) — la línea se corta en vez de tocar el eje.
  const confSegments = [];
  let curSeg = [];
  weeksData.forEach((w,i)=>{
    if (w[kC] > 0) { curSeg.push({x:xOf(i), y:yOf(w[kC]), i}); }
    else { if (curSeg.length) confSegments.push(curSeg); curSeg = []; }
  });
  if (curSeg.length) confSegments.push(curSeg);
  const confValidPts = confSegments.flat();

  el.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:${H}px;display:block;margin:0 auto;" preserveAspectRatio="xMidYMid meet">
      ${grid}
      <path d="${areaOf(projPts)}" fill="var(--amber)" opacity="0.12"/>
      <path d="${pathOf(projPts)}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 3"/>
      ${confSegments.map(seg => seg.length>1 ? `<path d="${areaOf(seg)}" fill="var(--blue)" opacity="0.10"/>` : '').join('')}
      ${confSegments.map(seg => `<path d="${pathOf(seg)}" fill="none" stroke="var(--blue)" stroke-width="2.4"/>`).join('')}
      ${confValidPts.map(p=>`<circle class="fc-dot" data-i="${p.i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.6" fill="var(--blue)" stroke="var(--surface)" stroke-width="1.3" style="cursor:pointer;"/>`).join('')}
      ${projPts.map((p,i)=>`<circle class="fc-dot" data-i="${i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="var(--amber)" stroke="var(--surface)" stroke-width="1.3" style="cursor:pointer;"/>`).join('')}
      ${xlbls}
    </svg>`;

  el.querySelectorAll('circle.fc-dot').forEach(dot=>{
    dot.addEventListener('mouseenter', ()=>{
      const i = +dot.dataset.i;
      const w = weeksData[i];
      const tip = document.getElementById('fcTooltip');
      const ej = w[kP] ? pct(w[kC], w[kP]) : 0;
      tip.innerHTML = `
        <div class="fc-tt-title">${w.label}</div>
        <div class="fc-tt-row"><span class="fc-tt-dot" style="background:var(--amber);"></span><span class="fc-tt-lbl">PRE</span><span class="fc-tt-val">${fmtM(w[kP])}</span></div>
        <div class="fc-tt-row"><span class="fc-tt-dot" style="background:var(--blue);"></span><span class="fc-tt-lbl">Confirmado</span><span class="fc-tt-val">${fmtM(w[kC])}</span></div>
        <div class="fc-tt-row"><span class="fc-tt-dot" style="background:var(--bad);"></span><span class="fc-tt-lbl">Cancelados</span><span class="fc-tt-val">${fmtM(w[kCanc])}</span></div>
        <div class="fc-tt-row"><span class="fc-tt-dot" style="background:var(--ok);"></span><span class="fc-tt-lbl">Total ADD+EXPOADD</span><span class="fc-tt-val">${fmtM(w[kA])}</span></div>
        <div class="fc-tt-sep"></div>
        <div class="fc-tt-row"><span class="fc-tt-lbl">% Ejec.</span><span class="fc-tt-val">${w[kP]?ej+'%':'—'}</span></div>`;
      tip.style.opacity = '1';
      const rect = el.getBoundingClientRect();
      const scaleX = rect.width / W, scaleY = rect.height / H;
      const cx = +dot.getAttribute('cx') * scaleX, cy = +dot.getAttribute('cy') * scaleY;
      tip.style.left = (rect.left + cx + 12) + 'px';
      tip.style.top = (rect.top + cy - 10) + 'px';
      // Los puntos de la derecha (últimas semanas) empujaban el cuadro fuera
      // de la ventana — si no cabe a la derecha del punto, se muestra a la
      // izquierda en su lugar.
      const tipRect = tip.getBoundingClientRect();
      if (tipRect.right > window.innerWidth - 8) {
        tip.style.left = (rect.left + cx - tipRect.width - 12) + 'px';
      }
    });
    dot.addEventListener('mouseleave', ()=>{ document.getElementById('fcTooltip').style.opacity='0'; });
  });
}

function portsMetricAgg(rows){

function refreshPorts(){
  const rows = (PORTS_RAW || []).filter(r=>['Confirmado','Cancelado','Proyectado'].includes(r.status));
  if(!document.getElementById('ports-kg')) return;
  const selStatus = msdFilterValues('msd-ports-status') || [];
  const selWeeksRaw = msdFilterValues('msd-ports-week');
  const selWeeks = selWeeksRaw ? selWeeksRaw.map(Number) : [];
  const selLine = msdFilterValues('msd-ports-line') || [];
  const selTop = msdFilterValues('msd-ports-top') || [];

  let ft = rows;
  if (selStatus.length) ft = ft.filter(r=>selStatus.includes(r.status));
  if (selWeeks.length) ft = ft.filter(r=>selWeeks.includes(r.pack_plan));
  if (selLine.length) ft = ft.filter(r=>selLine.includes(r.line));
  if (selTop.length) ft = ft.filter(r=>selTop.includes(r.transport_operator));

  document.getElementById('ports-stat').textContent = `${ft.length} de ${rows.length} registros · métrica: ${portsMetric==='fcl'?'FCL':'PO'}`;

  const unitLbl = portsMetric==='fcl' ? 'FCL' : 'PO';
  const totalAll = portsMetricAgg(ft);
  const confAll = portsMetricAgg(ft.filter(r=>r.status==='Confirmado'));
  const proyAll = portsMetricAgg(ft.filter(r=>r.status==='Proyectado'));
  const cancAll = portsMetricAgg(ft.filter(r=>r.status==='Cancelado'));

  document.getElementById('ports-kg').innerHTML = `<div class="kg">
    <div class="kc" style="--acc:var(--blue)"><div class="kl">Total (${unitLbl})</div><div class="kv">${portsFmt(totalAll)}</div></div>
    <div class="kc" style="--acc:var(--blue)"><div class="kl">Confirmados</div><div class="kv">${portsFmt(confAll)}</div><div class="kf">${totalAll?pct(confAll,totalAll):0}%</div></div>
    <div class="kc"><div class="kl">Proyectados</div><div class="kv">${portsFmt(proyAll)}</div><div class="kf">${totalAll?pct(proyAll,totalAll):0}%</div></div>

    const mode = Object.keys(modeCounts).sort((a,b)=>modeCounts[b]-modeCounts[a])[0] || '—';
    return {...p, conf:c, proy:pr, canc:k, total:tot, cumpl: tot?pct(c,tot):0, mode, recCount:sub.length};

        <div style="width:${p.total?(p.canc/p.total*100).toFixed(1):0}%;background:var(--bad);"></div>
      </div>
      <div class="pc-footer">
        <div class="pc-stat"><div class="pc-stat-val">${portsFmt(p.total)}</div><div class="pc-stat-lbl">${unitLbl}</div></div>

  const grandTotalPorts = sum(portStats.map(p=>p.total));

  document.querySelectorAll('.ports-bar-row').forEach(row=>{

  if (portsMetric==='po') weeksAll.forEach(wk=>PORTS_LIST.forEach(p=>{ byWeekPort[wk][p.name] = byWeekPort[wk][p.name].size; }));
  const mx = Math.max(1, ...weeksAll.map(wk=>PORTS_LIST.reduce((a,p)=>a+byWeekPort[wk][p.name],0)));

  document.getElementById('ports-proj-stat').textContent = `${weeksAll.length} semana(s) · métrica: ${unitLbl}`;

  chartEl.querySelectorAll('.sc-col').forEach(col=>{

function wepChecked_select(id){ const el = document.getElementById(id); return el ? el.value : 'ALL'; }
function wepPickCurrentWeek(rows){
  // Elige la semana cuyo rango de fechas de carga contiene HOY (o la más
  // cercana en el tiempo). Evita el bug de tomar el pack_plan numéricamente
  // más alto, que puede ser una reserva aislada muy a futuro con 1 sola fila.
  const weeks = [...new Set(rows.map(r=>r.pack_plan))];
  const now = new Date();
  let best = null, bestDist = Infinity, bestCount = -1;
  weeks.forEach(wk=>{
    const wkRows = rows.filter(r=>r.pack_plan===wk);
    const dates = wkRows.map(r=>parseLocalDate(r.date)).filter(Boolean);
    if (!dates.length) return;
    const minD = Math.min(...dates), maxD = Math.max(...dates);
    let dist;
    if (now >= minD && now <= maxD) dist = 0;
    else if (now < minD) dist = minD - now;
    else dist = now - maxD;
    // Ante empate de distancia, prioriza la semana con más filas (más representativa)
    if (dist < bestDist || (dist === bestDist && wkRows.length > bestCount)) {
      best = wk; bestDist = dist; bestCount = wkRows.length;
    }
  });
  return best !== null ? best : weeks.sort((a,b)=>b-a)[0];
}

function refreshWEP(){
  const all = WROWS || [];
  if (!document.getElementById('wep-kg')) return;
  const ppSelect = document.getElementById('wep-pp-select');
  const curWeek = ppSelect ? Number(ppSelect.value) : wepPickCurrentWeek(all);
  let rows = all.filter(r=>r.pack_plan===curWeek);

  const selPK = wepChecked_select('wep-pk-select');
  const selSH = wepChecked_select('wep-sh-select');
  const selMO = wepChecked_select('wep-mo-select');
  const selPOD = wepChecked_select('wep-pod-select');
  if (selPK!=='ALL') rows = rows.filter(r=>r.packing===selPK);
  if (selSH!=='ALL') rows = rows.filter(r=>r.shipper===selSH);
  if (selMO!=='ALL') rows = rows.filter(r=>r.mode===selMO);
  if (selPOD!=='ALL') rows = rows.filter(r=>r.pod===selPOD);

  const unit = wepMetric==='fcl' ? 'FCL' : 'Pallets';
  const fmtM = v => wepMetric==='fcl' ? fmt1(v) : Math.round(v).toLocaleString('es-PE');

  const days = [...new Set(rows.map(r=>r.date).filter(Boolean))].sort();
  const dayLabel = ds => { const dt = parseLocalDate(ds); return !dt ? ds : dt.toLocaleDateString('es-PE',{weekday:'short'}).toUpperCase().replace('.',''); };
  const dayDateLabel = ds => { const dt = parseLocalDate(ds); return !dt ? '' : dt.toLocaleDateString('es-PE',{day:'2-digit',month:'short'}).toUpperCase(); };

  const totalFCL = sum(rows.map(r=>r[wepMetric]||0));
  const packings = [...new Set(rows.map(r=>r.packing).filter(Boolean))];
  const pods = [...new Set(rows.map(r=>r.pod))];
  const modesUsed = [...new Set(rows.map(r=>r.mode).filter(Boolean))];
  const weekdayTotals = days.map(dy=>sum(rows.filter(r=>r.date===dy).map(r=>r[wepMetric]||0)));
  const maxW = Math.max(...weekdayTotals, 1);
  const peakIdx = weekdayTotals.indexOf(Math.max(...weekdayTotals));

  document.getElementById('wep-week-label').textContent = `${curWeek?'S'+curWeek:'—'} · ${days.length?dayDateLabel(days[0])+' – '+dayDateLabel(days[days.length-1]):''} · ${unit} por fecha de carga`;
  document.getElementById('wep-linecount').textContent = `${rows.length} líneas · ${fmtM(totalFCL)} ${unit}`;

  document.getElementById('wep-kg').innerHTML = `<div class="kg">
    <div class="kc" style="--acc:var(--amber)"><div class="kl">Total ${unit}</div><div class="kv">${fmtM(totalFCL)}</div></div>
    <div class="kc"><div class="kl">Pico del día</div><div class="kv">${fmtM(weekdayTotals[peakIdx]||0)}<span class="u">${days[peakIdx]?dayLabel(days[peakIdx])+' '+dayDateLabel(days[peakIdx]).split(' ')[0]:''}</span></div></div>
    <div class="kc"><div class="kl">Plantas</div><div class="kv">${packings.length}<span class="u">${packings.join(' · ')||'—'}</span></div></div>
    <div class="kc"><div class="kl">Destinos (POD)</div><div class="kv">${pods.length}</div></div>
    <div class="kc"><div class="kl">Modos</div><div class="kv">${modesUsed.length}<span class="u">${modesUsed.map(m=>m.slice(0,3).toUpperCase()).join(' · ')||'—'}</span></div></div>
  </div>`;

  const gridEl = document.getElementById('wep-grid');
  gridEl.style.setProperty('--wep-cols', `minmax(200px,1.6fr) repeat(${Math.max(days.length,1)}, minmax(56px,1fr)) 150px`);

  const headRow = `<div class="wep-row head"><div>Destino</div>${days.map(dy=>`<div class="wep-day-hd">${dayLabel(dy)}<b>${dayDateLabel(dy)}</b></div>`).join('')}<div class="wep-day-hd" style="text-align:right;padding-right:4px;">${unit}</div></div>`;

  const podTotalsAll = pods.map(p=>({name:p, val:sum(rows.filter(r=>r.pod===p).map(r=>r[wepMetric]||0))})).sort((a,b)=>b.val-a.val);
  const topPodName = podTotalsAll[0] ? podTotalsAll[0].name : null;
  const maxPodVal = Math.max(...podTotalsAll.map(p=>p.val), 1);
  const plantColors = ['var(--amber)','var(--teal)','var(--purple)','var(--blue)'];
  const mCls = m => m==='Marítimo'?'mM':m==='Aéreo'?'mA':'mT';
  const emptyCols = () => days.map(()=>'<div class="wep-day-cell">·</div>').join('');

  let bodyHtml = '';
  const grandTotalByDay = days.map(()=>0);
  let grandTotal = 0;

  packings.forEach((pk,pkIdx)=>{
    const pkRows = rows.filter(r=>r.packing===pk);
    const pkPods = new Set(pkRows.map(r=>r.pod));
    const pkTotal = sum(pkRows.map(r=>r[wepMetric]||0));
    const pkTotalsByDay = days.map(dy=>sum(pkRows.filter(r=>r.date===dy).map(r=>r[wepMetric]||0)));

    bodyHtml += `<div class="wep-plant-header" style="--pc:${plantColors[pkIdx%plantColors.length]};"><div class="wep-plant-name">${pk}<span class="wep-plant-sub">${pkRows.length} líneas · ${pkPods.size} POD</span></div><div class="mono" style="font-weight:700;color:${plantColors[pkIdx%plantColors.length]};">${fmtM(pkTotal)}</div></div>`;

    const modesInPk = [...new Set(pkRows.map(r=>r.mode))].sort((a,b)=>modeOrderIdx(a)-modeOrderIdx(b));
    modesInPk.forEach(mode=>{
      const shippersInMode = [...new Set(pkRows.filter(r=>r.mode===mode).map(r=>r.shipper))];
      shippersInMode.forEach(sh=>{
        bodyHtml += `<div class="wep-mode-row"><span class="wep-mode-badge ${mCls(mode)}">${mode}</span><b>${sh}</b></div>`;
        const podsForSh = [...new Set(pkRows.filter(r=>r.mode===mode&&r.shipper===sh).map(r=>r.pod))];
        podsForSh.forEach(pod=>{
          const podTotal = sum(pkRows.filter(r=>r.mode===mode&&r.shipper===sh&&r.pod===pod).map(r=>r[wepMetric]||0));
          const cells = days.map(dy=>{
            const v = sum(pkRows.filter(r=>r.mode===mode&&r.shipper===sh&&r.pod===pod&&r.date===dy).map(r=>r[wepMetric]||0));
            return `<div class="wep-day-cell"><span class="wep-cell ${v?'has-val':'zero'}">${v?fmtM(v):'·'}</span></div>`;
          }).join('');
          const isTop = pod===topPodName;
          bodyHtml += `<div class="wep-row pod"><div>${pod}${isTop?'<span class="wep-top-tag">TOP</span>':''}</div>${cells}<div class="wep-fcl-cell"><div class="wep-fcl-num">${fmtM(podTotal)}</div><div class="wep-pod-bar-wrap"><div class="wep-pod-bar" style="width:${calcPct(podTotal,maxPodVal)}%;"></div></div></div></div>`;
        });
      });
    });

    bodyHtml += `<div class="wep-row subtotal"><div>SUBTOTAL ${pk.toUpperCase()}</div>${pkTotalsByDay.map(v=>`<div class="wep-day-cell mono">${v?fmtM(v):'·'}</div>`).join('')}<div class="wep-fcl-cell wep-fcl-num" style="color:var(--amber);">${fmtM(pkTotal)}</div></div>`;

    pkTotalsByDay.forEach((v,i)=>{ grandTotalByDay[i]+=v; });
    grandTotal += pkTotal;
  });

  bodyHtml += `<div class="wep-row grandtotal"><div>TOTAL GENERAL</div>${grandTotalByDay.map(v=>`<div class="wep-day-cell mono">${v?fmtM(v):'·'}</div>`).join('')}<div class="wep-fcl-cell wep-fcl-num">${fmtM(grandTotal)}</div></div>`;

  gridEl.innerHTML = headRow + (bodyHtml || '<div class="empty-state">Sin datos de WROWS para esta semana</div>');

  // Carga por día
  document.getElementById('wep-daybars').innerHTML = days.map((dy,i)=>{
    const v = weekdayTotals[i];
    const isPeak = i===peakIdx;
    return `<div class="wep-side-bar-col"><span class="mono" style="font-size:10.5px;font-weight:${isPeak?700:400};color:${isPeak?'var(--amber)':'var(--ink-soft)'};">${v?fmtM(v):''}</span><div class="wep-side-bar-track"><div class="wep-side-bar-fill" style="height:${Math.max(4,calcPct(v,maxW))}%;background:${isPeak?'linear-gradient(180deg,var(--amber),#a97430)':'var(--navy2)'};"></div></div><span class="mono" style="font-size:9px;color:var(--ink-faint);">${dayLabel(dy)}</span></div>`;
  }).join('') || '<div class="empty-state">Sin datos</div>';

  // Insight dinámico: los 2 días con más carga
  if (days.length >= 2 && totalFCL > 0) {
    const idxSorted = weekdayTotals.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);
    const top2 = idxSorted.slice(0,2).sort((a,b)=>a.i-b.i);
    const top2Pct = pct(top2.reduce((a,t)=>a+t.v,0), totalFCL);
    document.getElementById('wep-insight').textContent = top2.length===2 ? `El ${top2Pct}% del programa se despacha entre ${dayLabel(days[top2[0].i]).toLowerCase()} y ${dayLabel(days[top2[1].i]).toLowerCase()}.` : '';
  } else {
    document.getElementById('wep-insight').textContent = '';
  }

  // Top destinos
  document.getElementById('wep-topdest').innerHTML = podTotalsAll.slice(0,6).map(p=>`
    <div class="wep-top-dest-row"><div class="hd"><span>${p.name}</span><span class="mono" style="color:var(--amber);">${fmtM(p.val)}</span></div><div class="bt"><div class="bf" style="width:${calcPct(p.val,maxPodVal)}%;background:var(--amber);"></div></div></div>`).join('') || '<div class="empty-state">Sin datos</div>';

  // Split por modo
  const modeColorsWep = {'Marítimo':'var(--teal)','Aéreo':'var(--purple)','Terrestre':'var(--amber)'};
  const splitData = modesUsed.map(m=>({mode:m, val:sum(rows.filter(r=>r.mode===m).map(r=>r[wepMetric]||0)), color:modeColorsWep[m]||'var(--ink-faint)'})).sort((a,b)=>b.val-a.val);
  const splitTrack = splitData.map(s=>`<div style="width:${totalFCL?(s.val/totalFCL*100).toFixed(1):0}%;background:${s.color};"></div>`).join('');
  const splitLegend = splitData.map(s=>`<div style="display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12.5px;"><span style="width:9px;height:9px;border-radius:2px;background:${s.color};flex-shrink:0;"></span><span style="flex:1;">${s.mode}</span><span class="mono" style="font-weight:600;">${fmtM(s.val)}</span></div>`).join('');
  document.getElementById('wep-splitmode').innerHTML = splitData.length ? `
    <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;">${splitTrack}</div>
    ${splitLegend}` : '<div class="empty-state">Sin datos</div>';
}

}

let LAST_EMBARQUES_FILTERED = [];

function pmiGlobalFiltered(dataset){
  const selPK = msdFilterValues('msd-pmi-pk') || [];
  const selPPraw = msdFilterValues('msd-pmi-pp');
  const selPP = selPPraw ? selPPraw.map(Number) : [];
  const selDD = msdFilterValues('msd-pmi-dd') || [];
  const selMO = msdFilterValues('msd-pmi-mo') || [];
  const selLO = msdFilterValues('msd-pmi-lo') || [];
  let ft = dataset || [];
  if (selPK.length) ft = ft.filter(r=>selPK.includes(r.packing));
  if (selPP.length) ft = ft.filter(r=>selPP.includes(r.pack_plan));
  if (selDD.length) ft = ft.filter(r=>selDD.includes(r.dispatch_date||''));
  if (selMO.length) ft = ft.filter(r=>selMO.includes(r.mode));
  if (selLO.length) ft = ft.filter(r=>selLO.includes(r.log_op));
  return ft;
}

function renderPMIKPIs(){

  const modes = Object.keys(modeMeta);
  const byMode = modes.map(m=>{ const sub = ft.filter(r=>r.mode===m); return { mode:m, fcl: sum(sub.map(r=>r.fcl||0)), po: new Set(sub.filter(r=>r.po).map(r=>r.po)).size }; });
  const bascGroups = {};
  ft.forEach(r=>{ const b = r.basc || '(sin estado)'; bascGroups[b] = (bascGroups[b]||0) + (r.fcl||0); });
  const bascRows = Object.entries(bascGroups).sort((a,b)=>b[1]-a[1]);
  const bascMax = Math.max(...bascRows.map(r=>r[1]), 1);
  const totalFcl = sum(ft.map(r=>r.fcl||0));
  const citaFcl = sum(ft.filter(r=>r.retiro_cita).map(r=>r.fcl||0));
  const loadFcl = sum(ft.filter(r=>r.load_status==='CARGADO').map(r=>r.fcl||0));
  const citaPct = totalFcl>0 ? pct(citaFcl,totalFcl) : 0;
  const loadPct = totalFcl>0 ? pct(loadFcl,totalFcl) : 0;

  const modeRows = byMode.map(m=>`<div class="pmi-mode-row" style="--mc:${modeMeta[m.mode].c};"><div class="pmi-mode-lbl">${modeMeta[m.mode].ic} ${m.mode}</div><div class="pmi-mode-val">${m.po}<span class="pmi-mode-sub">(${fmt1(m.fcl)} FCL)</span></div></div>`).join('');
  const bascRowsHtml = bascRows.map(([b,v])=>`<div class="pmi-basc-row"><div class="pmi-basc-lbl">${b}</div><div class="pmi-basc-bar-wrap"><div class="pmi-basc-bar" style="width:${(v/bascMax*100).toFixed(1)}%;"></div></div><div class="pmi-basc-val">${fmt1(v)}</div></div>`).join('');

  document.getElementById('pmi-kpis').innerHTML = `
    <div class="pmi-kpi-zone">
      <div class="pmi-kpi-col" style="min-width:230px;">
        <div class="pmi-kpi-h">Modo · PO diferenciados <span class="pmi-kpi-h-sub">(Σ FCL)</span></div>
        <div>${modeRows || '<div class="empty-state">Sin datos</div>'}</div>
      </div>
      <div class="pmi-kpi-col" style="flex:1;min-width:260px;">
        <div class="pmi-kpi-h">Σ FCL por Journey Status BASC</div>
        <div>${bascRowsHtml || '<div class="empty-state">Sin datos</div>'}</div>
      </div>
      <div class="pmi-kpi-col" style="min-width:280px;">
        <div class="pmi-kpi-h">Cobertura</div>
        <div style="display:flex;gap:14px;">
          <div class="pmi-ring-card">${pmiRing(citaPct,'var(--ok)')}<div><div class="pmi-ring-t">Cita de retiro</div><div class="pmi-ring-v">${fmt1(citaFcl)}<span class="pmi-ring-u"> / ${fmt1(totalFcl)}</span></div><div style="color:var(--ok);font-family:'JetBrains Mono',monospace;font-size:11px;">${totalFcl>0?citaPct+'%':'—'}</div></div></div>
          <div class="pmi-ring-card">${pmiRing(loadPct,'var(--amber)')}<div><div class="pmi-ring-t">Cargados</div><div class="pmi-ring-v">${fmt1(loadFcl)}<span class="pmi-ring-u"> / ${fmt1(totalFcl)}</span></div><div style="color:var(--amber);font-family:'JetBrains Mono',monospace;font-size:11px;">${totalFcl>0?loadPct+'%':'—'}</div></div></div>

}

function renderSenasa(){
  const all = SENASA || [];
  const inSelect = document.getElementById('sn-in-select');
  if (inSelect.dataset.built !== '1'){
    const inspectors = [...new Set(all.map(r=>r.inspector).filter(Boolean))].sort();
    inSelect.innerHTML = '<option value="ALL">Todos</option>' + inspectors.map(i=>`<option value="${i}">${i}</option>`).join('');
    inSelect.dataset.built = '1';
  }
  let ft = pmiGlobalFiltered(all);
  const selIN = inSelect.value;
  if (selIN !== 'ALL') ft = ft.filter(r=>r.inspector===selIN);

  const allTimes = [...new Set(ft.map(r=>r.insp_time).filter(Boolean))].sort();
  const hasST = ft.some(r=>!r.insp_time);
  const cols = [...allTimes, ...(hasST?['']:[])];

  document.getElementById('sn-head').innerHTML = `<tr><th style="width:9%;">Packing</th><th style="width:11%;">Loading Date</th><th style="width:9%;">Mode</th><th style="width:13%;">POD</th><th style="width:9%;">SENASA Att.</th>${cols.map(t=>`<th style="text-align:center;width:${Math.max(6, 42/Math.max(cols.length,1))}%;">${t||'Sin hora'}</th>`).join('')}<th style="text-align:right;width:8%;">Total</th></tr>`;

  const modeOrder = ['Marítimo','Aéreo','Terrestre'];
  const packings = [...new Set(ft.map(r=>r.packing).filter(Boolean))].sort();
  const gt = {}; cols.forEach(t=>gt[t]=0); gt['__t']=0;
  let bodyRows = [];

  packings.forEach(pk=>{
    const pkRows = ft.filter(r=>r.packing===pk);
    const dates = [...new Set(pkRows.map(r=>r.insp_date||''))].sort();
    let pkRowSpan = 0;
    const pkFirstIdx = bodyRows.length;

    dates.forEach(dk=>{
      const dateRows = pkRows.filter(r=>(r.insp_date||'')===dk);
      const dateT = {}; cols.forEach(t=>dateT[t]=0); dateT['__t']=0;
      const modes = [...new Set(dateRows.map(r=>r.mode))].sort((a,b)=>modeOrder.indexOf(a)-modeOrder.indexOf(b));
      let dateRowSpan = 0;
      const dateFirstIdx = bodyRows.length;

      modes.forEach(mode=>{
        const modeRows_ = dateRows.filter(r=>r.mode===mode);
        let modeRowSpan = 0;
        const modeFirstIdx = bodyRows.length;
        const pods = [...new Set(modeRows_.map(r=>r.pod))].sort();
        pods.forEach(pod=>{
          const podRows = modeRows_.filter(r=>r.pod===pod);
          const atts = [...new Set(podRows.map(r=>r.senasa_att))].sort();
          const podFirstIdx = bodyRows.length;
          atts.forEach(att=>{
            const attRows = podRows.filter(r=>r.senasa_att===att);
            const cellsData = {};
            cols.forEach(t=>{ cellsData[t] = new Set(attRows.filter(r=>(r.insp_time||'')===t).map(r=>r.po||Math.random())).size; });
            const rt = sum(Object.values(cellsData));
            cols.forEach(t=>{ gt[t]+=cellsData[t]; dateT[t]+=cellsData[t]; });
            gt['__t']+=rt; dateT['__t']+=rt;
            bodyRows.push({ pkCell:null, dateCell:null, modeCell:null, podCell:null, att, cellsData, rt });
            pkRowSpan++; dateRowSpan++; modeRowSpan++;
          });
          bodyRows[podFirstIdx].podCell = { pod, span: atts.length };
        });
        bodyRows[modeFirstIdx].modeCell = { mode, span: modeRowSpan };
      });
      bodyRows[dateFirstIdx].dateCell = { dk, span: dateRowSpan };
      bodyRows.push({ isDateTotal:true, dk, dateT });
    });
    bodyRows[pkFirstIdx].pkCell = { pk, span: pkRowSpan };
  });

  const mIcon = m => m==='Aéreo'?'✈':m==='Marítimo'?'⚓':'🚚';
  const mCls = m => m==='Aéreo'?'mA':m==='Marítimo'?'mM':'mT';

  let html = bodyRows.map(r=>{
    if (r.isDateTotal){
      return `<tr class="date-total"><td colspan="4">Total ${r.dk?pmiFmtDate(r.dk):'Sin fecha'}</td>${cols.map(t=>r.dateT[t]>0?`<td class="tv">${r.dateT[t]}</td>`:`<td class="tz">·</td>`).join('')}<td class="tot-v">${r.dateT['__t']}</td></tr>`;
    }
    const pkTd = r.pkCell ? `<td rowspan="${r.pkCell.span}" style="background:var(--surface-soft);font-weight:700;border-right:2px solid var(--blue);vertical-align:top;">${r.pkCell.pk}</td>` : '';
    const dateTd = r.dateCell ? `<td rowspan="${r.dateCell.span}" class="mono" style="vertical-align:top;font-size:10px;">${r.dateCell.dk?pmiFmtDate(r.dateCell.dk):'Sin fecha'}</td>` : '';
    const modeTd = r.modeCell ? `<td rowspan="${r.modeCell.span}" style="vertical-align:top;"><span class="mode-badge ${mCls(r.modeCell.mode)}">${mIcon(r.modeCell.mode)} ${r.modeCell.mode}</span></td>` : '';
    const podTd = r.podCell ? `<td rowspan="${r.podCell.span}" style="vertical-align:top;">${r.podCell.pod}</td>` : '';
    const attBadge = r.att==='PA' ? `<span class="att-pa">PA</span>` : `<span class="att-sn">SENASA</span>`;
    const cells = cols.map(t=>r.cellsData[t]>0?`<td class="tv">${r.cellsData[t]}</td>`:`<td class="tz">·</td>`).join('');
    return `<tr>${pkTd}${dateTd}${modeTd}${podTd}<td>${attBadge}</td>${cells}<td class="tot-v">${r.rt}</td></tr>`;
  }).join('');
  html += `<tr class="grand-total"><td colspan="5">Total general</td>${cols.map(t=>gt[t]>0?`<td class="tv">${gt[t]}</td>`:`<td class="tz">·</td>`).join('')}<td class="tot-v">${gt['__t']}</td></tr>`;

  document.getElementById('sn-body').innerHTML = html || `<tr><td colspan="${5+cols.length+1}" class="empty-state">Sin registros para este filtro</td></tr>`;

function downloadEmbarquesExcel(){
  if (!LAST_EMBARQUES_FILTERED.length){ alert('No hay registros para exportar con el filtro actual.'); return; }
  if (typeof XLSX === 'undefined'){ alert('La librería de Excel no cargó todavía. Intenta de nuevo en unos segundos.'); return; }
  const data = LAST_EMBARQUES_FILTERED.map(r=>({
    'Dispatch Round': r.round, 'Loading Date': r.load_date, 'Loading Time': r.load_time,
    'Positioning Time': r.postime, 'Packing Stage Estim.': r.pack_est, 'Journey Status BASC': r.basc,
    'Packing Stage Load Status': r.load_status, 'Instruction': r.instruction, 'PO': r.po,
    'Line': r.line, 'Logistics Operator': r.log_op, 'Transport Operator': r.transp_op,
    'Booking|AWB|CRT': r.booking, 'Container': r.container, 'POD': r.pod, 'Packing': r.packing,
    'Gate-In Storage': r.gatein, 'Gate-In Storage Address': r.gatein_address, 'Pack Plan': r.pack_plan, 'Dispatch Date': r.dispatch_date, 'Mode': r.mode,
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = Object.keys(data[0]).map(k=>({wch: Math.max(k.length, 14)}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dispatch Control');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Dispatch_Control_${stamp}.xlsx`);
}

  let html = '', rows = 0;
  Object.keys(pkGroups).sort().forEach(pk=>{
    const lnMap = pkGroups[pk];
    let pkRowCount = 0; Object.values(lnMap).forEach(recs=>pkRowCount+=recs.length);

        pkFirst = false;

function refreshAir(){
  const rows = AIR || [];
  if (!document.getElementById('air-kg')) return;
  const selPPraw = msdFilterValues('msd-air-pp');
  const selPP = selPPraw ? selPPraw.map(Number) : [];
  const selDD = msdFilterValues('msd-air-dd') || [];
  const selLOraw = msdFilterValues('msd-air-lo');

  let ft = rows;
  if (selPP.length) ft = ft.filter(r=>selPP.includes(r.pack_plan));
  if (selDD.length) ft = ft.filter(r=>selDD.includes(r.dispatch));
  if (selLOraw) ft = ft.filter(r=>selLOraw.includes(r.log_op));

  document.getElementById('air-stat').textContent = `${ft.length} de ${rows.length} registros`;

  const totPal = sum(ft.map(r=>r.pallets||0));
  const poCount = new Set(ft.filter(r=>r.po).map(r=>r.po)).size;
  const fin = ft.filter(r=>r.basc==='FINALIZADO').length;
  document.getElementById('air-kg').innerHTML = `<div class="kg">
    <div class="kc" style="--acc:var(--blue)"><div class="kl">Despachos (registro total)</div><div class="kv">${ft.length}</div></div>
    <div class="kc" style="--acc:var(--amber)"><div class="kl">PO asignada</div><div class="kv">${poCount}</div><div class="kf">${ft.length?pct(poCount,ft.length):0}%</div></div>
    <div class="kc" style="--acc:var(--purple)"><div class="kl">Pallets</div><div class="kv">${totPal}</div></div>
    <div class="kc" style="--acc:var(--ok)"><div class="kl">BASC Final.</div><div class="kv">${fin}</div><div class="kf">${ft.length?pct(fin,ft.length):0}%</div></div>
  </div>`;

  const byLine = {};
  ft.forEach(r=>{ if(!r.po) return; const ln = r.line||'(sin línea)'; if(!byLine[ln]) byLine[ln]=new Set(); byLine[ln].add(r.po); });
  const airlinesF = Object.entries(byLine).map(([name,s])=>({name,count:s.size})).sort((a,b)=>b.count-a.count).map((a,i)=>({...a,color:AIR_PALETTE[i%AIR_PALETTE.length]}));
  const totalPO = sum(airlinesF.map(a=>a.count)) || 1;
  const mxPO = Math.max(...airlinesF.map(a=>a.count), 1);
  const airBars = airlinesF.map(a=>`<div style="display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:8px;margin-bottom:8px;"><div style="text-align:right;font-size:11px;display:flex;align-items:center;gap:5px;justify-content:flex-end;"><span style="width:8px;height:8px;border-radius:2px;background:${a.color};"></span>${a.name}</div><div style="background:var(--surface-soft);border-radius:5px;height:14px;overflow:hidden;border:1px solid var(--line);"><div style="width:${(a.count/mxPO*100).toFixed(1)}%;background:${a.color};height:100%;"></div></div><div class="mono" style="font-weight:600;font-size:11px;">${a.count} <span style="color:var(--ink-faint);font-weight:400;font-size:9.5px;">${pct(a.count,totalPO)}%</span></div></div>`).join('');
  let cum = 0;
  const conic = airlinesF.map(a=>{ const st=cum, en=cum+(a.count/totalPO*360); cum=en; return `${a.color} ${st.toFixed(1)}deg ${en.toFixed(1)}deg`; }).join(',') || 'var(--line) 0deg 360deg';
  const legend = airlinesF.map(a=>`<div class="dli"><span class="dls" style="background:${a.color};"></span><span>${a.name}</span><span class="dlv">${a.count}·${pct(a.count,totalPO)}%</span></div>`).join('');
  document.getElementById('air-airlines').innerHTML = `
    <div class="card"><div class="ct">PO por aerolínea</div>${airBars || '<div class="empty-state">Sin datos</div>'}</div>
    <div class="card"><div class="ct">Distribución</div><div class="donut-wrap"><div class="donut-ring" style="background:conic-gradient(${conic});"><div class="donut-center"><div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;">${totalPO}</div><div style="font-size:8px;color:var(--ink-faint);">PO</div></div></div><div class="donut-legend">${legend}</div></div></div>`;

  document.getElementById('air-body').innerHTML = ft.map((r,i)=>{
    const idx = rows.indexOf(r);
    const cl = r.basc==='FINALIZADO'?'ok':(r.basc&&(r.basc.includes('PACKING')||r.basc.includes('RUTA')))?'warn':r.basc?'bad':'neu';
    return `<tr><td>${r.shipper||'—'}</td><td class="mono">${r.instruction||'—'}</td><td>${r.log_op||'—'}</td><td>${r.dest||'—'}</td><td class="mono">${r.dispatch||'—'}</td><td class="mono" style="text-align:right">${r.pallets||0}</td><td class="mono">${r.awb||'—'}</td><td class="mono">${r.file||'—'}</td><td>${r.line||'—'}</td><td>${r.transp_op||'—'}</td><td><span class="pill ${cl}" style="font-size:9px;">${r.basc||'—'}</span></td><td class="mono">${r.dam||'—'}</td><td><button class="air-btn-driver" onclick="openAirDetail(${idx})">🚛</button></td></tr>`;
  }).join('') || `<tr><td colspan="13" class="empty-state">Sin datos para este filtro</td></tr>`;
  document.getElementById('air-tbl-stat').textContent = `${ft.length} filas`;

  // Tabla dinámica Packing / Instruction
  const pkGroups = {};
  ft.forEach(r=>{ const pk=r.packing||'(en blanco)'; if(!pkGroups[pk]) pkGroups[pk]={}; const ins=r.instruction||'(en blanco)'; if(!pkGroups[pk][ins]) pkGroups[pk][ins]=[]; pkGroups[pk][ins].push(r); });
  let atHtml = '', gtPal=0, gtFcl=0, atRows=0;
  Object.keys(pkGroups).sort().forEach(pk=>{
    const insMap = pkGroups[pk];
    let pkPal=0, pkFcl=0, pkFirst=true;
    Object.keys(insMap).sort().forEach(ins=>{
      const recs = insMap[ins];
      let insPal=0, insFcl=0;
      recs.forEach((r,i)=>{
        insPal += (r.pallets||0); insFcl += (r.fcl||0); atRows++;
        atHtml += `<tr>${(pkFirst&&i===0)?`<td rowspan="${Object.values(insMap).reduce((a,rs)=>a+rs.length,0)}" style="background:var(--surface-soft);font-weight:700;border-right:2px solid var(--blue);vertical-align:top;">${pk}</td>`:''}${i===0?`<td rowspan="${recs.length}" style="vertical-align:top;font-weight:500;">${ins}</td>`:''}<td class="mono">${r.dispatch||'—'}</td><td>${r.shipper||'—'}</td><td>${r.log_op||'(en blanco)'}</td><td class="mono">${r.postime||'(en blanco)'}</td><td>${r.gatein||'(en blanco)'}</td><td class="tv">${r.pallets||0}</td><td class="tv">${fmt1(r.fcl||0)}</td></tr>`;
      });
      atHtml += `<tr class="pk-total"><td colspan="2">Total ${ins}</td><td colspan="5"></td><td class="tot-v">${insPal}</td><td class="tot-v">${fmt1(insFcl)}</td></tr>`;
      pkPal += insPal; pkFcl += insFcl; pkFirst = false;
    });
    atHtml += `<tr class="pk-total"><td colspan="2">Total ${pk}</td><td colspan="5"></td><td class="tot-v">${pkPal}</td><td class="tot-v">${fmt1(pkFcl)}</td></tr>`;
    gtPal += pkPal; gtFcl += pkFcl;
  });
  atHtml += `<tr class="grand-total"><td colspan="7">Total general</td><td class="tot-v">${gtPal}</td><td class="tot-v">${fmt1(gtFcl)}</td></tr>`;
  document.getElementById('at-body').innerHTML = atHtml || `<tr><td colspan="9" class="empty-state">Sin datos para este filtro</td></tr>`;
  document.getElementById('at-stat').textContent = `${atRows} filas · ${fmt1(gtFcl)} FCL`;
}
